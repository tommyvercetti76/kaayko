<!DOCTYPE html>
<html lang="en">
<head>
  <!-- the theme before the first paint: header.js set it at the end of <body>, so a
       dark-mode shopper saw a light frame on every page open (25 Oct 2026) -->
  <script>try { if (localStorage.getItem('darkTheme') === 'enabled') document.documentElement.classList.add('dark-theme'); } catch (e) {}</script>
  <script src="/js/prod-config.js"></script>
  <!-- every module the page runs, asked for at once: they used to arrive in four
       rounds, each waiting on the one before (519 ms to the product's name, 25 Oct 2026) -->
  <link rel="modulepreload" href="/js/pages/pdp.js">
  <link rel="modulepreload" href="/js/product.js">
  <link rel="modulepreload" href="/js/kaayko_ui.js">
  <link rel="modulepreload" href="/js/store-satire.js">
  <link rel="modulepreload" href="/js/suggest.js">
  <link rel="modulepreload" href="/js/fitPicker.js">
  <link rel="modulepreload" href="/js/services/storeApi.js">
  <link rel="modulepreload" href="/js/kit.js">
  <link rel="modulepreload" href="/js/components/Toast.js">
  <link rel="modulepreload" href="/js/priceMap.js">
  <link rel="modulepreload" href="/js/util.js">
  <link rel="modulepreload" href="/js/productTypes.js">
  <link rel="modulepreload" href="/js/cartManager.js">
  <link rel="modulepreload" href="/js/sustainabilityAlert.js">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Kaayko · Printed to order</title>
  <meta name="description" content="A Kaayko original, printed to order. Five things to a bag, guest checkout, no tricks." />
  <meta property="og:title" content="Kaayko Store">
  <meta property="og:description" content="A Kaayko original, printed to order. Five things to a bag, no tricks.">
  <meta property="og:image" content="https://kaayko.com/assets/store-og.png">
  <meta name="robots" content="index, follow" />

  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="theme-color" content="#d4af37">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/storestyle.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/kaaykoFilterModal.css" />
  <link rel="stylesheet" href="/css/animal.css" />
  <link rel="stylesheet" href="/css/product.css" />
  <link rel="stylesheet" href="/css/fitPicker.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="https://js.stripe.com/v3/" async></script>
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/pdp-motion.css" />
  <script src="/js/pdp-motion.js"></script>
</head>

<body class="store-v2 product-v2" data-pdp="product">
  <a class="skip-link" href="#product-root">Skip to product</a>
  <header class="header">
    <div class="header-top">
      <div class="header-brand">
        <p class="header-title">Kaayko</p>
        <p class="header-subtitle">Style Your Soul</p>
      </div>
      <nav class="top-menu"><ul></ul></nav>
      <div class="header-controls">
        <button class="theme-toggle-icon" aria-label="Switch theme"></button>
        <button class="fab-menu mobile-only" aria-label="Open menu">
          <span class="header-icon-stack" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu-overlay"><ul></ul></div>
  </header>

  <nav class="animal-breadcrumb">
    <a href="/store">← All products</a>
  </nav>

  <main id="product-root" class="product-root" tabindex="-1">
    <section class="product-shell skeleton" aria-hidden="true">
      <div class="product-gallery-skeleton"></div>
      <div class="product-info-skeleton">
        <div class="sk-line sk-line-xxl"></div>
        <div class="sk-line sk-line-md"></div>
        <div class="sk-line sk-line-full"></div>
        <div class="sk-line sk-line-full"></div>
        <div class="sk-line sk-line-half"></div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Product image gallery">
    <div class="modal-content">
      <button id="close-modal-button" class="modal-close material-icons" aria-label="Close">close</button>
      <button class="modal-nav modal-nav-left material-icons" aria-label="Previous">chevron_left</button>
      <button class="modal-nav modal-nav-right material-icons" aria-label="Next">chevron_right</button>
      <div id="modal-image-container" class="modal-image-container"></div>
    </div>
  </div>

  <footer class="site-footer is-light">
    <nav aria-label="Footer">
      <a href="/store">Store</a>
      <a href="/store/about">About</a>
      <a href="/store/privacy">Privacy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/legal/returns">Returns</a>
      <a href="/legal/shipping">Shipping</a>
      <a href="mailto:help@kaayko.com">Help</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <script src="/js/secretStore.js"></script>
  <script src="/js/header.js"></script>
  <script type="module" src="/js/pages/pdp.js"></script>

</body>
</html>

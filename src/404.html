<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Kaayko</title>
  <meta name="description" content="That page doesn't exist on kaayko.com. Here's where to go instead.">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#080808">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808;
      --fg: #ede8df;
      --muted: rgba(237, 232, 223, 0.6);
      --faint: rgba(237, 232, 223, 0.38);
      --gold: #b5935a;
      --gold-bright: #d9bd7b;
      --line: rgba(181, 147, 90, 0.2);
      --serif: "Cormorant Garamond", Georgia, serif;
      --display: "Bebas Neue", Impact, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem clamp(1.25rem, 5vw, 4rem);
      border-bottom: 1px solid var(--line);
    }
    .label {
      font-family: var(--display);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.82rem;
      color: var(--gold);
      text-decoration: none;
    }
    .topbar a.label:hover { color: var(--gold-bright); }
    main {
      flex: 1;
      display: flex; flex-direction: column; justify-content: center;
      padding: clamp(3rem, 12vh, 8rem) clamp(1.25rem, 5vw, 4rem);
      max-width: 46rem;
    }
    .code {
      font-family: var(--display);
      font-size: clamp(4rem, 14vw, 8rem);
      line-height: 0.9;
      color: var(--gold);
      letter-spacing: 0.04em;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      margin: 1.25rem 0 0;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--muted);
      font-size: clamp(1.02rem, 2.2vw, 1.22rem);
      line-height: 1.6;
      margin-top: 1rem;
      max-width: 38rem;
    }
    nav.links {
      margin-top: 2.5rem;
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.75rem;
    }
    nav.links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 1.05rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    nav.links a:hover { color: var(--gold-bright); border-color: var(--gold); }
    footer {
      padding: 1.5rem clamp(1.25rem, 5vw, 4rem);
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="label" href="/">&larr; Kaayko</a>
    <span class="label" style="color: rgba(181,147,90,0.45);">404</span>
  </header>

  <main>
    <div class="code">404</div>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>
      Either the link was wrong, or something moved and I didn&rsquo;t leave a forwarding address.
      Both happen. Here&rsquo;s where the real pages are.
    </p>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/paddlingout">Paddling Out</a>
      <a href="/paddlingout/methodology">How the Paddle Score works</a>
      <a href="/forge">Forge</a>
      <a href="/about">About</a>
    </nav>
  </main>

  <footer>&copy; 2026 Kaayko</footer>
</body>
</html>

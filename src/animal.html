<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/prod-config.js"></script>
  <script src="/js/site-features.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Kaayko · Printed to order</title>
  <meta name="description" content="The wildlife behind every Kaayko drawing: species, status, range. Printed to order, two things to a bag." />
  <meta property="og:title" content="Kaayko Store">
  <meta property="og:description" content="The wildlife behind every Kaayko drawing. Printed to order, two things to a bag, no tricks.">
  <meta property="og:image" content="https://kaayko.com/assets/store-og.png">
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Kaayko">

  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="theme-color" content="#d4af37">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/storestyle.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/kaaykoFilterModal.css" />
  <link rel="stylesheet" href="/css/animal.css?v=ivory2" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/animal.v3.css" />
  <link rel="stylesheet" href="/css/fitPicker.css" />
  <link rel="stylesheet" href="/css/pdp-motion.css" />
  <script src="/js/pdp-motion.js"></script>
</head>

<body class="store-v2 animal-v2" data-pdp="animal">
  <a class="skip-link" href="#animal-root">Skip to main content</a>
  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="header-brand">
        <h1 class="header-title">Kaayko</h1>
        <p class="header-subtitle">Style Your Soul</p>
      </div>
      <nav class="top-menu"><ul></ul></nav>
      <div class="header-controls">
        <button class="theme-toggle-icon" aria-label="Switch theme"></button>
        <button class="fab-menu mobile-only" aria-label="Open menu">
          <span class="header-icon-stack" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu-overlay"><ul></ul></div>
  </header>

  <!-- BREADCRUMB -->
  <nav class="animal-breadcrumb">
    <a href="/store">← All wildlife</a>
  </nav>

  <!-- MAIN -->
  <main id="animal-root" class="animal-root" tabindex="-1">
    <!-- Skeleton, replaced on data load -->
    <section class="animal-hero skeleton" aria-hidden="true">
      <div class="animal-hero-art-skeleton"></div>
      <div class="animal-hero-text-skeleton">
        <div class="sk-line sk-line-xxl"></div>
        <div class="sk-line sk-line-md"></div>
        <div class="sk-pill"></div>
        <div class="sk-line sk-line-full"></div>
        <div class="sk-line sk-line-full"></div>
        <div class="sk-line sk-line-half"></div>
      </div>
    </section>
  </main>

  <!-- IMAGE MODAL (zoom for SKU images) -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Product image gallery">
    <div class="modal-content">
      <button id="close-modal-button" class="modal-close material-icons" aria-label="Close">close</button>
      <button class="modal-nav modal-nav-left material-icons" aria-label="Previous">chevron_left</button>
      <button class="modal-nav modal-nav-right material-icons" aria-label="Next">chevron_right</button>
      <div id="modal-image-container" class="modal-image-container"></div>
    </div>
  </div>

  <footer class="site-footer is-light">
    <nav aria-label="Footer">
      <a href="/store">Store</a>
      <a href="/store/about">About</a>
      <a href="/store/privacy">Privacy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/legal/returns">Returns</a>
      <a href="/legal/shipping">Shipping</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="/js/secretStore.js"></script>
  <script src="/js/header.js"></script>
  <script type="module" src="/js/pages/pdp.js"></script>

</body>
</html>

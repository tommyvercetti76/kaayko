  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080808;
      --panel-a: #0d0c0a;
      --panel-b: #111315;
      --panel-c: #10110d;
      --panel-d: #0c1012;
      --fg: #ede8df;
      --muted: rgba(237, 232, 223, 0.58);
      --line: rgba(181, 147, 90, 0.74);
      --gold: #b5935a;
      --gold-bright: #d9bd7b;
      --ease: cubic-bezier(0.76, 0, 0.24, 1);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    .brand-ghost {
      position: fixed;
      inset: 50% auto auto 50%;
      width: min(38vw, 340px);
      min-width: 180px;
      opacity: 0.035;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }

    .page {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 360ms ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
    }

    .choice {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 0;
      appearance: none;
      background: var(--panel-a);
      color: inherit;
      cursor: pointer;
      overflow: hidden;
      text-decoration: none;
      transition: filter 320ms ease;
    }

    .choice.secondary {
      background: var(--panel-b);
    }

    /* Home: three panels — Paddling Out · Forge · Store */
    #pg-home .choice.primary {
      background: var(--panel-d);
    }

    #pg-home .choice.tertiary {
      background: var(--panel-c);
    }

    #pg-home .choice.secondary {
      background: var(--panel-b);
    }

    .choice::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.035), transparent 42%);
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .choice-glow {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 0;
      width: clamp(220px, 34vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 189, 123, 0.46), rgba(217, 189, 123, 0.18) 34%, transparent 68%);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, -50%, 0);
      transition: opacity 260ms ease;
      will-change: transform, opacity;
    }

    /* Subheader sits directly under its headline — heading, then subheading,
       then the CTA row. Its space is reserved at all times so revealing it
       never nudges the block. */
    .choice-sub {
      position: relative;
      z-index: 1;
      margin-top: clamp(0.7rem, 1.6vh, 1.1rem);
      max-width: min(78%, 30ch);
      color: var(--muted);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(0.76rem, 1.5vw, 0.94rem);
      font-style: italic;
      letter-spacing: 0.11em;
      line-height: 1.45;
      opacity: 0;
      text-align: center;
      transform: translateY(6px);
      transition: opacity 320ms ease, transform 320ms var(--ease);
    }

    .choice-label {
      position: relative;
      z-index: 1;
      font-family: "Bebas Neue", Impact, sans-serif;
      width: min(78%, 10.5em);
      max-width: calc(100% - clamp(2rem, 8vw, 7rem));
      font-size: clamp(3.2rem, 7.2vw, 7rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 0.92;
      text-align: center;
      text-transform: uppercase;
      /* Wraps rather than spills — a two-word headline in a squeezed panel
         breaks at its space instead of running under the divider. Scramble
         preserves spaces, so the break point never jitters. */
      overflow-wrap: break-word;
      transition: color 260ms ease, transform 360ms var(--ease), font-size 420ms var(--ease);
    }

    .seam {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 50%;
      z-index: 3;
      height: 1px;
      /* Every divider carries the wordmark, so every divider gets the same
         gap cut into it — no line is ever left with an empty notch. */
      background: linear-gradient(
        to right,
        var(--line) 30%,
        transparent 30%,
        transparent 70%,
        var(--line) 70%
      );
      pointer-events: none;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 760ms cubic-bezier(0.16, 1, 0.3, 1) 120ms, top 440ms var(--ease), left 440ms var(--ease);
    }

    .page.active .seam {
      transform: scaleX(1);
    }

    .mark {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      /* Centred on the seam — the gap in the line keeps it clean */
      transform: translate(-50%, -50%);
      color: var(--gold);
      font-size: clamp(0.82rem, 2.2vw, 1.1rem);
      font-style: italic;
      letter-spacing: 0.62em;
      opacity: 0;
      pointer-events: none;
      text-transform: lowercase;
      /* Fire exactly when seam completes: 120ms delay + 760ms draw = 880ms */
      transition: opacity 300ms ease-out 880ms, top 440ms var(--ease), left 440ms var(--ease);
      white-space: nowrap;
    }

    .page.active .mark {
      opacity: 0.86;
    }

    .footer {
      /* fixed (not absolute) so ABOUT/Inventory stay pinned with the splash
         choices. The splash is the page now; there is nothing below it to
         scroll up through except the site footer. */
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 clamp(1.15rem, 5vw, 3.2rem);
      pointer-events: none;
    }

    .footer a {
      color: rgba(181, 147, 90, 0.48);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(0.7rem, 1.55vw, 0.84rem);
      font-style: italic;
      letter-spacing: 0.24em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 220ms ease, transform 300ms var(--ease);
      pointer-events: auto;
      white-space: nowrap;
    }

    .footer a:hover,
    .footer a:focus-visible {
      color: var(--gold-bright);
    }

    .choice:focus-visible,
    .footer a:focus-visible {
      outline: 1px solid var(--gold-bright);
      outline-offset: 8px;
    }

    @media (hover: hover) and (pointer: fine) {
      .choice:hover::before,
      .choice:focus-visible::before {
        opacity: 1;
      }

      .choice:hover .choice-label,
      .choice:focus-visible .choice-label {
        color: var(--gold-bright);
      }

      .choice:hover .choice-sub,
      .choice:focus-visible .choice-sub {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .choice.is-hot::before {
      opacity: 1;
    }

    .choice.is-hot .choice-glow {
      opacity: 1;
    }

    /* Highlighted — by hover, by focus, or because the panel is open.
       The headline warms and its subheader comes up; the underline belongs
       to the CTAs alone. */
    .choice.is-hot .choice-label,
    .choice--wide .choice-label {
      color: var(--gold-bright);
    }

    .choice.is-hot .choice-sub,
    .choice--wide .choice-sub {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 720px) {
      .page {
        flex-direction: row;
      }

      .seam {
        top: 7%;
        bottom: 7%;
        left: 50%;
        right: auto;
        width: 1px;
        height: auto;
        transform: scaleY(0);
      }

      .page.active .seam {
        transform: scaleY(1);
      }

      .mark {
        writing-mode: vertical-rl;
        /* On desktop restore centred position — vertical seam gap handles the line */
        transform: translate(-50%, -50%);
        background: none;
        padding: 0;
      }

      /* Gap in the middle so the mark text never sits on the line */
      .seam {
        background: linear-gradient(
          to bottom,
          var(--line) 36%,
          transparent 36%,
          transparent 64%,
          var(--line) 64%
        );
      }
    }

    @media (max-width: 520px) {
      .choice-label {
        width: min(84%, 9.6em);
        max-width: calc(100% - 1.5rem);
        font-size: clamp(3rem, 15vw, 5.2rem);
        letter-spacing: 0.055em;
      }

      .choice-sub {
        font-size: 0.76rem;
        letter-spacing: 0.08em;
      }

      .footer {
        padding-inline: 1rem;
      }

      .footer a {
        font-size: 0.66rem;
        letter-spacing: 0.18em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    /* ── Expandable panels (Forge, Store) ─────────────────────────────── */

    .panel-menu {
      flex-direction: column;
      cursor: pointer;
    }

    /* Highlighting any section widens it to half the axis, leaving a quarter
       each to the other two. Same rule for all three — the seams and
       wordmarks are repositioned by JS to match, at every breakpoint. */
    #pg-home .choice {
      transition: filter 320ms ease, flex 520ms var(--ease);
    }

    .choice--wide {
      flex: 2;
    }

    /* Panel-count font scaling — set via JS on data-panels attribute.
       Three panels are narrower, so the headline also gets more of its
       panel to work with — "PADDLING OUT" holds one line at every width. */
    [data-panels="3"] .choice-label {
      width: min(94%, 13em);
      max-width: calc(100% - clamp(1rem, 2.4vw, 2rem));
      font-size: clamp(2.4rem, 5vw, 5rem);
      letter-spacing: 0.06em;
    }

    [data-panels="4"] .choice-label {
      font-size: clamp(1.8rem, 3.5vw, 3.5rem);
      letter-spacing: 0.04em;
    }

    /* While one section is wide the other two are down to a quarter — step
       their headlines back so they stay clear of the dividers */
    #pg-home:has(.choice--wide) .choice:not(.choice--wide) .choice-label {
      font-size: clamp(1.6rem, 2.9vw, 3.1rem);
      letter-spacing: 0.05em;
    }

    /* ── CTA row inside a panel ───────────────────────────────────────── */
    /* Collapsed by default so the headline stays optically centred */
    .cta-group {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(1.6rem, 3.2vw, 2.8rem);
      max-width: 92%;
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: max-height 420ms var(--ease),
                  margin-top 420ms var(--ease),
                  opacity 280ms ease 100ms;
    }

    .panel--open .cta-group {
      max-height: 4rem;
      margin-top: clamp(1.3rem, 3vh, 2rem);
      opacity: 1;
      pointer-events: auto;
    }

    .cta {
      position: relative;
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      padding: 0.1rem 0 0.2rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      text-align: center;
      text-decoration: none;
    }

    .cta:focus-visible {
      outline: none;
    }

    /* The label carries the whole affordance — no rule under it, no
       explanatory line beneath it. */
    .cta-label {
      color: rgba(237, 232, 223, 0.92);
      font-size: clamp(0.78rem, 1.35vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 220ms ease;
    }

    .cta:hover .cta-label,
    .cta:focus-visible .cta-label,
    .cta:active .cta-label {
      color: var(--gold-bright);
    }

    /* Touch has no hover to lean on — every section states what it is */
    @media (hover: none), (pointer: coarse) {
      .choice-sub {
        opacity: 1;
        transform: none;
      }
    }

    /* The splash is the page. The words about what Kaayko builds live on
       /about, which the footer links; they used to be repeated here as an
       essay under the fold, and a landing page that keeps going after the
       landing is a landing page nobody trusted to land. */

    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>


  <main class="shell" aria-label="Kaayko landing">
    <h1 class="sr-only">Kaayko &mdash; Paddling Out, Forge, Kortex, the Store and School</h1>
    <img class="brand-ghost" src="/kaayko-logo-512.png" alt="" aria-hidden="true">

    <section class="page active" id="pg-home" aria-label="Kaayko">
      <div class="seam"></div>
      <div class="mark">kaayko</div>
      <a class="choice primary" href="/paddlingout" target="_blank" rel="noopener noreferrer">
        <span class="choice-label" data-text="Paddling Out">Paddling Out</span>
        <span class="choice-sub">Know before you paddle</span>
      </a>
      <section class="choice tertiary panel-menu" id="panel-forge" aria-label="Forge" tabindex="0">
        <span class="choice-label" data-text="Forge">Forge</span>
        <span class="choice-sub">Open-source local-first AI workstation</span>
        <div class="cta-group" aria-label="Forge options">
          <a class="cta" href="/forge-gallery">
            <span class="cta-label">Gallery</span>
          </a>
          <a class="cta" href="https://github.com/tommyvercetti76/Forge" rel="noopener noreferrer">
            <span class="cta-label">Code</span>
          </a>
        </div>
      </section>

      <a class="choice secondary" id="panel-youtube" href="https://www.youtube.com/@travelingout" target="_blank" rel="noopener noreferrer" data-feature="youtube">
        <span class="choice-label" data-text="YouTube">YouTube</span>
        <span class="choice-sub">Traveling Out — the channel</span>
      </a>

      <section class="choice secondary panel-menu" id="panel-store" aria-label="Store" tabindex="0" data-feature="store">
        <span class="choice-label" data-text="Store">Store</span>
        <span class="choice-sub">Invite only — for now</span>
        <div class="cta-group" aria-label="Store options">
          <button class="cta" id="cta-access" type="button">
            <span class="cta-label">Access</span>
          </button>
          <button class="cta" id="cta-request" type="button">
            <span class="cta-label">Request</span>
          </button>
        </div>
      </section>
    </section>

    <nav class="footer" aria-label="Splash links">
      <!-- Only shown while the YouTube panel is off — the panel replaces it -->
      <a href="https://www.youtube.com/@travelingout" rel="noopener noreferrer" data-feature-off="youtube">YouTube</a>
      <a href="/about">About</a>
      <a href="/card">Inventory</a>
      <a href="/privacy">Privacy</a>
    </nav>
  </main>





  <script src="/js/storeAccess.js"></script>
  <script type="module" src="/js/pages/index.js"></script>

</body>

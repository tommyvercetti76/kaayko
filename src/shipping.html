<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaayko Shipping</title>
<meta name="description" content="Pick up the parcel. Fly it past the towers. Let go early enough to land it.">
<meta name="theme-color" content="#0B0A08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet">
<style>
/* Kaayko Shipping. Nothing here touches the scored Mail Run on a product page;
   that game is worth money and is replayed server-side, so this one shares no
   code with it and posts nothing anywhere. */
:root {
  --ink: #0B0A08; --paper: #F4EEDF; --gold: #B5935A; --gold-lit: #F0D9A0;
  --dim: rgba(244,238,223,.5); --hair: rgba(181,147,90,.22);
  --green: #7FE3B4;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Josefin Sans', Futura, Avenir, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); }
body { font-family: var(--serif); min-height: 100svh; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.cap { font-family: var(--sans); font-weight: 300; font-size: 10.5px;
       letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }

.wrap { min-height: 100svh; display: grid; place-items: center; padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.game { width: min(96vw, 880px); display: grid; gap: 14px; }

.head { display: flex; justify-content: space-between; align-items: baseline;
        gap: 14px; flex-wrap: wrap; }
.head h1 { margin: 0; font-weight: 300; font-size: clamp(21px, 4vw, 32px); letter-spacing: .01em; }
.stats { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.stats b { font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums;
           color: var(--paper); }

.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px;
         overflow: hidden; border: 1px solid var(--hair); background: #05070f; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* Every overlay is a real menu with a way out, never a dead end. */
.menu { position: absolute; inset: 0; display: grid; place-content: center; gap: 15px;
        justify-items: center; text-align: center; padding: 22px;
        background: rgba(6,7,14,.88); backdrop-filter: blur(3px);
        overflow: auto; }
.menu[hidden] { display: none; }
.menu h2 { margin: 0; font-weight: 300; font-size: clamp(23px, 5vw, 36px); }
.menu p { margin: 0; color: var(--dim); max-width: 42ch; line-height: 1.6; font-size: 16px; }
.opts { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
.opt { padding: 10px 19px; border: 1px solid var(--hair); border-radius: 999px;
       background: transparent; color: var(--paper); cursor: pointer;
       font-family: var(--sans); font-weight: 300; font-size: 11px;
       letter-spacing: .18em; text-transform: uppercase; }
.opt:hover { border-color: var(--gold); color: var(--gold-lit); }
.opt.is-primary { background: var(--gold-lit); color: var(--ink); border-color: var(--gold-lit); }
.opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* the sign-the-board form, shown inside the game-over menu */
.sign { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.sign input { width: 15ch; padding: 9px 13px; border-radius: 999px;
              border: 1px solid var(--hair); background: rgba(244,238,223,.06);
              color: var(--paper); font-family: var(--sans); font-size: 13px;
              letter-spacing: .08em; }
.sign input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.said { min-height: 1.2em; font-size: 14px; color: var(--gold-lit); }
.said.is-bad { color: #E7A184; }

.board { width: min(30ch, 78vw); display: grid; gap: 4px; margin: 0; padding: 0; }
.board li { display: grid; grid-template-columns: 2ch 1fr auto; gap: 10px;
            list-style: none; font-size: 17px; padding: 3px 0;
            border-bottom: 1px solid rgba(181,147,90,.14); }
.board li b { font-weight: 400; font-variant-numeric: tabular-nums; }
.board li.is-you { color: var(--gold-lit); }
.board li i { font-style: normal; color: var(--dim); font-size: 13px; }

/* two controls, side by side. Release only occupies space when it is live. */
.keys { display: grid; grid-template-columns: 1fr; gap: 10px; }
.keys.has-parcel { grid-template-columns: 1fr 1fr; }
.key { width: 100%; padding: 18px 10px; border: 1px solid var(--gold); border-radius: 12px;
       background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold-lit);
       font-family: var(--sans); font-size: 13px; letter-spacing: .16em;
       text-transform: uppercase; cursor: pointer;
       touch-action: none; user-select: none; -webkit-user-select: none;
       -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.key.is-down { background: var(--gold-lit); color: var(--ink); }
.key:disabled { opacity: .35; cursor: default; }
.key[hidden] { display: none; }
#drop { border-color: var(--green); color: var(--green);
        background: color-mix(in srgb, var(--green) 12%, transparent); }
#drop.is-down { background: var(--green); color: var(--ink); }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rules { color: var(--dim); font-size: 15px; line-height: 1.6; margin: 0; }
@media (max-width: 560px) {
  .stats { gap: 12px; }
  .stats b { font-size: 20px; }
  /* Two controls have to share a phone's width. "Release package" is the longer
     label, so the pair gets tighter type rather than a wrapped, ragged button. */
  .key { padding: 16px 6px; font-size: 11px; letter-spacing: .08em; }
  .keys { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .menu { backdrop-filter: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="game">

    <div class="head">
      <h1>Kaayko Shipping</h1>
      <div class="stats">
        <span class="cap">Delivered <b id="score">0</b></span>
        <span class="cap">Dropped <b id="missed">0</b></span>
        <span class="cap">Best <b id="best">0</b></span>
        <span class="cap" id="stage">Clear run</span>
        <span class="cap" id="phase">Day</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="cv" aria-label="Kaayko Shipping. Hold to climb, collect a parcel, release it over a green pad."></canvas>

      <div class="menu" id="menu">
        <p class="cap" id="m-kicker">Kaayko &middot; endless</p>
        <h2 id="m-title">Kaayko Shipping</h2>
        <p id="m-body">Fly through a parcel to pick it up. Release it over a green pad.</p>
        <div id="m-extra"></div>
        <div class="opts" id="m-opts"></div>
      </div>
    </div>

    <div class="keys" id="keys">
      <button type="button" class="key" id="key" disabled>Hold to climb</button>
      <button type="button" class="key" id="drop" hidden>Release package</button>
    </div>

    <div class="foot">
      <p class="rules cap">Space to climb &middot; Enter to release &middot; Esc to pause</p>
      <p class="rules cap"><a href="/card">Back to the cards</a></p>
    </div>

  </div>
</main>

<script type="module">
import { shipping, stageAt, phaseFor, PHASES } from '/js/arcade/shipping.js';
import { rows, post, clear } from '/js/arcade/board.js';

const $ = (id) => document.getElementById(id);
const cv = $('cv'), menu = $('menu'), opts = $('m-opts'), extra = $('m-extra');
const key = $('key'), drop = $('drop'), keys = $('keys');
const scoreEl = $('score'), missedEl = $('missed'), bestEl = $('best');
const stageEl = $('stage'), phaseEl = $('phase');

const BEST_KEY = 'kaayko.shipping.best';
let best = 0;
try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (_) {}
bestEl.textContent = best;

/* A finished run mints this. board.js will not accept a score without it, so a
   name cannot be added to the board except by playing. */
let runToken = null, lastRun = null;

/* Every menu hides the release button, so coming back from one has to ask the
   game whether a parcel is still in hand. Without this, pausing while carrying
   left you holding a parcel you could never let go of. */
function showDrop(on) {
  drop.hidden = !on;
  keys.classList.toggle('has-parcel', on);
  if (!on) drop.classList.remove('is-down');
}

const game = shipping(cv, {
  onScore(n) { scoreEl.textContent = n; stageEl.textContent = game.stageName; },
  onMiss(n) { missedEl.textContent = n; },
  onCarry(on) { showDrop(on); },
  onEnd(r) {
    if (r.score > best) {
      best = r.score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
      bestEl.textContent = best;
    }
    runToken = `run-${r.score}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    lastRun = r;
    show('over', r);
  }
});
phaseEl.textContent = game.phaseLabel;

/* ── menus ───────────────────────────────────────────────────────────────────
   Every state has one, and every one lists the ways out. Nothing here can trap
   you behind an overlay with no button.                                       */
const boardList = (highlight) => {
  const r = rows();
  if (!r.length) return '<p class="cap">Nobody has signed it yet today.</p>';
  return '<ol class="board">' + r.map((row, i) =>
    `<li class="${row.name === highlight ? 'is-you' : ''}"><i>${i + 1}</i>` +
    `<span>${esc(row.name)}</span><b>${row.score}</b></li>`).join('') + '</ol>';
};
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SCREENS = {
  start: () => ({
    kicker: 'Kaayko &middot; endless',
    title: 'Kaayko Shipping',
    body: 'Hold to climb, let go to fall. Fly through a parcel to pick it up, then ' +
          'release it over a green pad. It falls faster than you do, so let go early.',
    opts: [['Start flying', () => begin(), true],
           ['How it works', () => show('how')],
           ['Today’s board', () => show('board')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  }),
  how: () => ({
    kicker: 'How it works',
    title: 'Lead the pad',
    body: 'A released parcel keeps your speed and then drops at twice your weight. ' +
          'Aim where the pad will be, not where it is. Miss and you lose the parcel, ' +
          'nothing else. Weather turns at 5, towers move at 10, pads narrow at 15. ' +
          'The sky follows your clock — right now it is ' + game.phaseLabel.toLowerCase() + '.',
    opts: [['Start flying', () => begin(), true],
           ['Back', () => show('start')]]
  }),
  board: () => ({
    kicker: 'Temporary board',
    title: 'Today only',
    body: 'It lives in this browser and clears itself at midnight. Eight places.',
    html: boardList(),
    opts: [['Start flying', () => begin(), true],
           ['Clear the board', () => { clear(); show('board'); }],
           ['Back', () => show('start')]]
  }),
  paused: () => ({
    kicker: 'Paused',
    title: `${game.score} delivered`,
    body: 'Nothing is lost. Pick one.',
    opts: [['Resume', () => { hide(); game.resume(); key.disabled = false; showDrop(game.carrying); }, true],
           ['Start again', () => begin()],
           ['How it works', () => show('how')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  }),
  over: (r) => ({
    kicker: r.score >= best && r.score > 0 ? 'A new best' : 'Down',
    title: `${r.score} delivered`,
    body: r.score === 0
      ? (r.missed ? 'Parcels are not deliveries. Release earlier — it falls faster than you.'
                  : 'Nothing shipped. Fly through a parcel first, then find a green pad.')
      : `Down in ${r.stage.toLowerCase()}, ${r.missed} dropped. Best today is ${best}.`,
    sign: r.score > 0,
    opts: [['Fly again', () => begin(), true],
           ['Today’s board', () => show('board')],
           ['How it works', () => show('how')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  })
};

function show(which, arg) {
  const s = SCREENS[which](arg);
  $('m-kicker').innerHTML = s.kicker;
  $('m-title').textContent = s.title;
  $('m-body').innerHTML = s.body;
  extra.innerHTML = s.html || '';
  if (s.sign) signForm();
  opts.innerHTML = '';
  for (const [label, fn, primary] of s.opts) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (primary ? ' is-primary' : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    opts.appendChild(b);
  }
  menu.hidden = false;
  key.disabled = true;
  showDrop(false);
  opts.querySelector('.opt')?.focus({ preventScroll: true });
}
const hide = () => { menu.hidden = true; };

/* Signing the board. Every rejection says which gate said no and why, so this
   is a door with a sign on it rather than a field that silently refuses. */
function signForm() {
  const box = document.createElement('div');
  box.className = 'sign';
  box.innerHTML = '<input id="who" maxlength="14" autocomplete="off" ' +
    'spellcheck="false" placeholder="Sign the board" aria-label="Your name for the board">' +
    '<button type="button" class="opt" id="signit">Add</button>';
  const said = document.createElement('p');
  said.className = 'said';
  extra.append(box, said);

  const go = () => {
    const name = box.querySelector('#who').value;
    const r = post({ name, score: lastRun.score, token: runToken }, runToken);
    if (!r.ok) { said.className = 'said is-bad'; said.textContent = r.why; return; }
    runToken = null;                                     // one post per run
    said.className = 'said';
    said.textContent = r.place === 1 ? 'Top of the board.' : `Number ${r.place}.`;
    box.remove();
    const list = document.createElement('div');
    list.innerHTML = boardList(name.replace(/\s+/g, ' ').trim());
    extra.appendChild(list);
  };
  box.querySelector('#signit').addEventListener('click', go);
  box.querySelector('#who').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); go(); }
    e.stopPropagation();                                 // Enter here is not a release
  });
}

function begin() {
  hide();
  runToken = null;
  scoreEl.textContent = '0';
  missedEl.textContent = '0';
  stageEl.textContent = stageAt(0).name;
  phaseEl.textContent = PHASES[phaseFor()].label;
  key.disabled = false;
  showDrop(false);
  game.start();
}

/* ── the two controls ────────────────────────────────────────────────────────
   Climb is a hold. Release is a press, and only exists while you are carrying. */
const live = () => !key.disabled && menu.hidden;
const holdOn = (e) => {
  if (!live()) return;
  e.preventDefault();
  key.classList.add('is-down');
  game.hold(true);
};
const holdOff = () => { key.classList.remove('is-down'); game.hold(false); };

for (const el of [key, cv]) {
  el.addEventListener('pointerdown', (e) => {
    // Capture first, but never let it take the flight down with it: this throws
    // NotFoundError when the pointer is already gone, and it used to run BEFORE
    // holdOn, so one throw here left the plane with no controls at all.
    try { el.setPointerCapture?.(e.pointerId); } catch (_) {}
    holdOn(e);
  });
  el.addEventListener('pointerup', holdOff);
  el.addEventListener('pointercancel', holdOff);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
window.addEventListener('pointerup', holdOff);

function release() {
  if (!live()) return;
  if (!game.release()) return;
  drop.classList.add('is-down');
  setTimeout(() => drop.classList.remove('is-down'), 110);
}
drop.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); release(); });
drop.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if (menu.hidden && game.pause()) show('paused');
    return;
  }
  if (!menu.hidden) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault(); if (!e.repeat) { key.classList.add('is-down'); game.hold(true); }
  } else if (e.code === 'Enter' || e.code === 'ArrowDown' || e.key === 'r' || e.key === 'R') {
    e.preventDefault(); if (!e.repeat) release();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') holdOff();
});
// Losing the window mid-flight pauses rather than quietly killing the run.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && menu.hidden && game.pause()) show('paused');
});

show('start');
</script>
</body>
</html>

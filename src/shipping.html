<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaayko Shipping</title>
<meta name="description" content="Pick up the parcel. Fly it past the towers. Let go early enough to land it.">
<meta name="theme-color" content="#0B0A08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet">
<style>
/* Kaayko Shipping. Nothing here touches the scored Mail Run on a product page;
   that game is worth money and is replayed server-side, so this one shares no
   code with it and posts nothing anywhere. */
:root {
  --ink: #0B0A08; --paper: #F4EEDF; --gold: #B5935A; --gold-lit: #F0D9A0;
  --dim: rgba(244,238,223,.5); --hair: rgba(181,147,90,.22);
  --green: #7FE3B4;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Josefin Sans', Futura, Avenir, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); }
body { font-family: var(--serif); min-height: 100svh; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.cap { font-family: var(--sans); font-weight: 300; font-size: 10.5px;
       letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }

.wrap { min-height: 100svh; display: grid; place-items: center; padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.game { width: min(96vw, 880px); display: grid; gap: 14px; }

.head { display: flex; justify-content: space-between; align-items: baseline;
        gap: 14px; flex-wrap: wrap; }
.head h1 { margin: 0; font-weight: 300; font-size: clamp(21px, 4vw, 32px); letter-spacing: .01em; }
.stats { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.stats b { font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums;
           color: var(--paper); }

.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px;
         overflow: hidden; border: 1px solid var(--hair); background: #05070f; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* Every overlay is a real menu with a way out, never a dead end. */
.menu { position: absolute; inset: 0; display: grid; place-content: center; gap: 15px;
        justify-items: center; text-align: center; padding: 22px;
        background: rgba(6,7,14,.88); backdrop-filter: blur(3px);
        overflow: auto; }
.menu[hidden] { display: none; }
.menu h2 { margin: 0; font-weight: 300; font-size: clamp(23px, 5vw, 36px); }
.menu p { margin: 0; color: var(--dim); max-width: 42ch; line-height: 1.6; font-size: 16px; }
.opts { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
.opt { padding: 10px 19px; border: 1px solid var(--hair); border-radius: 999px;
       background: transparent; color: var(--paper); cursor: pointer;
       font-family: var(--sans); font-weight: 300; font-size: 11px;
       letter-spacing: .18em; text-transform: uppercase; }
.opt:hover { border-color: var(--gold); color: var(--gold-lit); }
.opt.is-primary { background: var(--gold-lit); color: var(--ink); border-color: var(--gold-lit); }
.opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* the sign-the-board form, shown inside the game-over menu */
.sign { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.sign input { width: 15ch; padding: 9px 13px; border-radius: 999px;
              border: 1px solid var(--hair); background: rgba(244,238,223,.06);
              color: var(--paper); font-family: var(--sans); font-size: 13px;
              letter-spacing: .08em; }
.sign input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.said { min-height: 1.2em; font-size: 14px; color: var(--gold-lit); }
.said.is-bad { color: #E7A184; }

.board { width: min(30ch, 78vw); display: grid; gap: 4px; margin: 0; padding: 0; }
.board li { display: grid; grid-template-columns: 2ch 1fr auto; gap: 10px;
            list-style: none; font-size: 17px; padding: 3px 0;
            border-bottom: 1px solid rgba(181,147,90,.14); }
.board li b { font-weight: 400; font-variant-numeric: tabular-nums; }
.board li.is-you { color: var(--gold-lit); }
.board li i { font-style: normal; color: var(--dim); font-size: 13px; }

/* two controls, side by side. Release only occupies space when it is live. */
.keys { display: grid; grid-template-columns: 1fr; gap: 10px; }
.keys.has-parcel { grid-template-columns: 1fr 1fr; }
.key { width: 100%; padding: 18px 10px; border: 1px solid var(--gold); border-radius: 12px;
       background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold-lit);
       font-family: var(--sans); font-size: 13px; letter-spacing: .16em;
       text-transform: uppercase; cursor: pointer;
       touch-action: none; user-select: none; -webkit-user-select: none;
       -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.key.is-down { background: var(--gold-lit); color: var(--ink); }
.key:disabled { opacity: .35; cursor: default; }
.key[hidden] { display: none; }
#drop { border-color: var(--green); color: var(--green);
        background: color-mix(in srgb, var(--green) 12%, transparent); }
#drop.is-down { background: var(--green); color: var(--ink); }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rules { color: var(--dim); font-size: 15px; line-height: 1.6; margin: 0; }
@media (max-width: 560px) {
  .stats { gap: 12px; }
  .stats b { font-size: 20px; }
  /* Two controls have to share a phone's width. "Release package" is the longer
     label, so the pair gets tighter type rather than a wrapped, ragged button. */
  .key { padding: 16px 6px; font-size: 11px; letter-spacing: .08em; }
  .keys { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { .menu { backdrop-filter: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="game">

    <div class="head">
      <h1>Kaayko Shipping</h1>
      <div class="stats">
        <span class="cap">Delivered <b id="score">0</b></span>
        <span class="cap">Dropped <b id="missed">0</b></span>
        <span class="cap">Best <b id="best">0</b></span>
        <span class="cap" id="stage">Clear run</span>
        <span class="cap" id="phase">Day</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="cv" aria-label="Kaayko Shipping. Hold to climb, collect a parcel, release it over a green pad."></canvas>

      <div class="menu" id="menu">
        <p class="cap" id="m-kicker">Kaayko &middot; endless</p>
        <h2 id="m-title">Kaayko Shipping</h2>
        <p id="m-body">Fly through a parcel to pick it up. Release it over a green pad.</p>
        <div id="m-extra"></div>
        <div class="opts" id="m-opts"></div>
      </div>
    </div>

    <div class="keys" id="keys">
      <button type="button" class="key" id="key" disabled>Hold to climb</button>
      <button type="button" class="key" id="drop" hidden>Release package</button>
    </div>

    <div class="foot">
      <p class="rules cap">Space to climb &middot; Enter to release &middot; Esc to pause</p>
      <p class="rules cap"><a href="/card">Back to the cards</a></p>
    </div>

  </div>
</main>

<script type="module" src="/js/pages/shipping.js"></script>
</body>
</html>

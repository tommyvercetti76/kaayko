  <meta property="og:image" content="https://kaayko.com/assets/kaayko-og.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Forge — Local-First Generative AI for Apple Silicon">
  <meta name="twitter:description" content="MIT-licensed generative AI that runs entirely on your own Apple Silicon machine. No cloud, no API keys, no telemetry.">
  <meta name="twitter:image" content="https://kaayko.com/assets/kaayko-og.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070806;
      --panel-left: #0f120f;
      --panel-right: #0b1014;
      --ink: #efe7dc;
      --muted: rgba(239, 231, 220, 0.62);
      --line: rgba(180, 146, 92, 0.7);
      --gold: #d1b073;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 15% 80%, rgba(209, 176, 115, 0.16), transparent 40%), var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow: hidden;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: absolute;
      z-index: 4;
      top: 1.1rem;
      left: 1.2rem;
      right: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .topbar a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 180ms ease, color 180ms ease;
    }

    .topbar a:hover {
      color: var(--ink);
      border-color: var(--line);
    }

    .split {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .choice {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: filter 260ms ease;
      isolation: isolate;
    }

    .choice-glow {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 0;
      width: clamp(220px, 34vw, 500px);
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, -50%, 0);
      background: radial-gradient(circle, rgba(209, 176, 115, 0.42), rgba(209, 176, 115, 0.16) 38%, transparent 68%);
      transition: opacity 240ms ease;
      will-change: transform, opacity;
    }

    .choice::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 260ms ease;
      background: linear-gradient(130deg, rgba(255, 255, 255, 0.08), transparent 44%);
      z-index: 0;
    }

    .choice:hover::before {
      opacity: 1;
    }

    .choice:hover {
      filter: brightness(1.08);
    }

    .choice.is-hot .choice-glow {
      opacity: 1;
    }

    .choice.gallery {
      background: var(--panel-left);
    }

    .choice.code {
      background: var(--panel-right);
    }

    .choice + .choice {
      border-top: 1px solid var(--line);
    }

    .label-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 86%;
    }

    .label {
      font-family: "Bebas Neue", Impact, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(3.1rem, 10vw, 8rem);
      line-height: 0.9;
      color: var(--ink);
      white-space: nowrap;
      perspective: 520px;
    }

    .char {
      display: inline-block;
      transform: translateY(30px) rotateX(92deg);
      transform-origin: 50% 100%;
      opacity: 0;
      animation: flipIn 620ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      animation-delay: calc(var(--delay) * 42ms + 100ms);
    }

    .kicker {
      margin-top: 1rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      font-style: italic;
      text-transform: none;
      font-size: clamp(0.84rem, 1.8vw, 1rem);
    }

    .mark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      padding: 0.35rem 0.55rem;
      color: var(--gold);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 0.66rem;
      background: var(--bg);
    }

    @keyframes flipIn {
      0% {
        transform: translateY(30px) rotateX(92deg);
        opacity: 0;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translateY(0) rotateX(0deg);
        opacity: 1;
      }
    }

    @media (min-width: 760px) {
      .split {
        flex-direction: row;
      }

      .choice + .choice {
        border-top: 0;
        border-left: 1px solid var(--line);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .char {
        animation: none;
        transform: none;
        opacity: 1;
      }

      .choice,
      .choice::before,
      .topbar a,
      .choice-glow {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Forge options">
    <div class="topbar">
      <a href="/">Back to Kaayko</a>
      <span>Forge</span>
    </div>

    <h1 class="mark">forge</h1>

    <section class="split">
      <a class="choice gallery" href="/forge-gallery" aria-label="Open Forge Gallery">
        <div class="label-wrap">
          <div class="label" data-text="Gallery">Gallery</div>
          <div class="kicker">A visual vault in progress</div>
        </div>
      </a>

      <a class="choice code" href="https://github.com/tommyvercetti76/Forge" target="_blank" rel="noopener noreferrer" aria-label="Open Forge GitHub repository">
        <div class="label-wrap">
          <div class="label" data-text="Code">Code</div>
          <div class="kicker">Source, scripts, and commits</div>
        </div>
      </a>
    </section>
  </main>

  <script>
    (function () {
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      function buildFlipLetters(label) {
        const text = label.dataset.text || label.textContent.trim();
        label.dataset.text = text;
        label.textContent = "";

        Array.from(text).forEach((char, idx) => {
          const span = document.createElement("span");
          span.className = "char";
          span.style.setProperty("--delay", idx.toString());
          span.textContent = char === " " ? "\u00A0" : char;
          label.appendChild(span);
        });
      }

      function scrambleLabel(label) {
        if (prefersReducedMotion) return;

        const target = label.dataset.text || label.textContent.trim();
        const chars = Array.from(target);
        const locked = chars.map((c) => c === " ");

        chars.forEach((char, idx) => {
          if (char === " ") return;
          window.setTimeout(() => {
            locked[idx] = true;
          }, 260 + idx * 46);
        });

        const timer = window.setInterval(() => {
          label.textContent = chars
            .map((char, idx) => {
              if (char === " ") return " ";
              if (locked[idx]) return char;
              return POOL[Math.floor(Math.random() * POOL.length)];
            })
            .join("");

          if (locked.every(Boolean)) {
            window.clearInterval(timer);
            buildFlipLetters(label);
          }
        }, 42);
      }

      function attachCursorGlow(choice) {
        const glow = document.createElement("span");
        const state = { x: 0, y: 0, tx: 0, ty: 0, raf: 0 };
        glow.className = "choice-glow";
        glow.setAttribute("aria-hidden", "true");
        choice.prepend(glow);

        const render = () => {
          state.x += (state.tx - state.x) * 0.18;
          state.y += (state.ty - state.y) * 0.18;
          glow.style.transform = "translate3d(" + state.x + "px," + state.y + "px,0) translate(-50%,-50%)";
          if (choice.classList.contains("is-hot")) {
            state.raf = window.requestAnimationFrame(render);
            return;
          }
          state.raf = 0;
        };

        const updateTarget = (event) => {
          const rect = choice.getBoundingClientRect();
          state.tx = event.clientX - rect.left;
          state.ty = event.clientY - rect.top;
        };

        choice.addEventListener("pointerenter", (event) => {
          updateTarget(event);
          state.x = state.tx;
          state.y = state.ty;
          choice.classList.add("is-hot");
          if (!state.raf) state.raf = window.requestAnimationFrame(render);
        });

        choice.addEventListener("pointermove", updateTarget);
        choice.addEventListener("pointerleave", () => {
          choice.classList.remove("is-hot");
        });
      }

      const labels = Array.from(document.querySelectorAll(".label"));
      labels.forEach(buildFlipLetters);
      labels.forEach((label, idx) => {
        window.setTimeout(() => scrambleLabel(label), 520 + idx * 130);
      });

      document.querySelectorAll(".choice").forEach(attachCursorGlow);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#" class="dark-theme">
<head>
  <script src="/js/prod-config.js"></script>
  <script src="/js/prefs.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/kaayko-icons.js"></script>
  <script src="/js/waterType.js"></script>
  <script src="/js/consent-notice.js" defer></script>
  <script>document.documentElement.classList.add('dark-theme');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Title & robots: updated dynamically by JS when lake data loads -->
  <title>Paddle Forecast | Kaayko Paddling Out</title>
  <!-- noindex: parameterized page — content varies per ?id=; prevent duplicate indexing -->
  <meta name="robots" content="noindex, follow">

  <!-- Open Graph: static fallbacks — JS overwrites these once lake data loads -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kaayko.com/paddlingout/forecast">
  <meta property="og:title" content="Paddle Forecast | Kaayko Paddling Out">
  <meta property="og:description" content="Real-time AI paddle conditions — wind speed, water temperature, UV index, and a 3-day hourly heatmap. Know before you go.">
  <meta property="og:image" content="https://kaayko.com/assets/paddlingout-og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kaayko Paddling Out — lake paddle forecast">
  <meta property="og:site_name" content="Kaayko">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@kaayko">
  <meta name="twitter:title" content="Paddle Forecast | Kaayko">
  <meta name="twitter:description" content="Live AI paddle conditions — wind, water temp, UV, 3-day forecast. Know before you paddle.">
  <meta name="twitter:image" content="https://kaayko.com/assets/paddlingout-og.png">
  <meta name="twitter:image:alt" content="Kaayko Paddling Out lake forecast">

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <meta name="theme-color" content="#080808">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://api-vwcc5j4qda-uc.a.run.app">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Shared store CSS -->
  <link rel="stylesheet" href="/css/base.css">

  <!-- Page CSS (defines @font-face + --modal-* vars + brand layout) -->
  <link rel="stylesheet" href="/css/forecast.css" />

  <!-- Component CSS (unmodified) -->
  <link rel="stylesheet" href="/js/components/RatingHero.css" />
  <link rel="stylesheet" href="/js/components/SafetyWarnings.css" />
  <link rel="stylesheet" href="/js/components/KonditionsHeatmap.css" />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/js/components/PoHeader.css">
  <script src="/js/components/PoHeader.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/po-system.css">
</head>

<body>

  <div id="po-header" data-title="Forecast" data-eyebrow="Paddling Out" data-back="/paddlingout" data-current="none"></div>
  <script>PoHeader.mount()</script>

  <!-- HERO: full-viewport-width, lives outside <main> max-width container -->
  <div class="forecast-page-header">
    <div class="forecast-page-title" id="forecastPageTitle">
      <h2 id="forecastLakeName">Loading…</h2>
      <p id="forecastLakeLocation"></p>
    </div>
    <div class="forecast-fav-slot" id="forecastFavSlot"></div>
  </div>

  <!-- FORECAST PAGE CONTENT -->
  <main class="forecast-main">

    <!-- Loading state: skeleton mirrors the real layout so the page doesn't
         reflow when data lands -->
    <div class="forecast-loading" id="forecastLoading" role="status" aria-label="Loading conditions">
      <div class="fsk-grid" aria-hidden="true">
        <div class="fsk-col">
          <div class="fsk fsk-ring"></div>
          <div class="fsk fsk-line w60"></div>
          <div class="fsk fsk-stats"></div>
        </div>
        <div class="fsk-col">
          <div class="fsk fsk-line w40"></div>
          <div class="fsk fsk-bar"></div>
          <div class="fsk fsk-bar"></div>
          <div class="fsk fsk-bar"></div>
        </div>
      </div>
      <p>Loading conditions…</p>
    </div>

    <!-- Error state -->
    <div class="forecast-error" id="forecastError" style="display:none">
      <div class="forecast-error-icon">⚠</div>
      <h3>Unable to Load Conditions</h3>
      <p>We couldn't fetch the latest data for this location.</p>
      <button class="forecast-retry-btn" id="retryBtn">Try Again</button>
    </div>

    <!-- Main content (hidden until data loads) -->
    <div class="forecast-content" id="forecastContent" style="display:none">

      <!-- ── Two-column desktop grid ───────────────────────────────────── -->
      <div class="forecast-body">

        <!-- Two INDEPENDENT rails — each flows its own content, so a panel
             opening in one column never inflates empty space in the other. -->

        <!-- LEFT RAIL: score story → alerts → preparation -->
        <div class="forecast-col-left">
          <div id="ratingHeroContainer"></div>
          <div class="forecast-alert-drawer" id="forecastAlertDrawer"></div>
          <div class="forecast-facts" id="prepStack"></div>
        </div>

        <!-- RIGHT RAIL: outlook → the spot dossier -->
        <div class="forecast-col-right">
          <div id="heatmapContainer"></div>
          <div class="forecast-location-info" id="locationInfo"></div>
        </div>

      </div>
      <!-- ── Full-width bottom ──────────────────────────────────────────── -->
      <div class="forecast-api-status" id="apiStatus"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <nav aria-label="Footer">
      <a href="/paddlingout">Paddling Out</a>
      <a href="/paddlingout/methodology">Methodology</a>
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="/js/header.js"></script>
  <script src="/js/services/spotTime.js"></script>
  <script src="/js/components/RatingHero.js"></script>
  <script src="/js/components/KonditionsHeatmap.js"></script>
  <script src="/js/services/apiClient.js"></script>
  <script src="/js/services/dataTransformer.js"></script>

  <script src="/js/pages/forecast.js"></script>


</body>
</html>

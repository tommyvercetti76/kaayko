<body>

    <div class="forecast-error" id="forecastError" style="display:none">

    <div class="forecast-content" id="forecastContent" style="display:none">

      <!-- ── Two-column desktop grid ───────────────────────────────────── -->
      <div class="forecast-body">

        <!-- Two INDEPENDENT rails — each flows its own content, so a panel
             opening in one column never inflates empty space in the other. -->

          <div id="ratingHeroContainer"></div>
          <div class="forecast-alert-drawer" id="forecastAlertDrawer"></div>

      </div>

  <!-- Scripts -->
  <script src="/js/header.js"></script>
  <script src="/js/components/RatingHero.js"></script>
  <script src="/js/components/KonditionsHeatmap.js"></script>
  <script src="/js/services/apiClient.js"></script>
  <script src="/js/services/dataTransformer.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // ── API endpoint helper (mirrors paddlingout.js logic) ──────────────────
    function getApiBase() {
      if (window.FORCE_PRODUCTION_MODE) return window.PRODUCTION_API_BASE;
      const h = window.location.hostname;
      if (h === 'localhost' || h === '127.0.0.1') return `${window.location.origin}/api`;
      return 'https://api-vwcc5j4qda-uc.a.run.app';
    }

    // Sync apiClient with prod-config.js if production is forced
    if (window.FORCE_PRODUCTION_MODE && window.apiClient) {
      window.apiClient.setMode('production');
    }

    function getSkillLevelFromRating(rating) {
      const r = parseFloat(rating);
      if (r >= 3.7) return 'WORTH IT';
      if (r >= 2.7) return 'CAREFUL';
      return 'HARD PASS';
    }

    // ── Timezone helpers (copied from advancedModal.js) ─────────────────────
    function estimateTimezone(lat, lng) {
      if (lat >= 25 && lat <= 49 && lng >= -125 && lng <= -66) {
        if (lng <= -114) return 'America/Los_Angeles';
        if (lng <= -104) return 'America/Denver';
        if (lng <= -87)  return 'America/Chicago';
        return 'America/New_York';
      }
      if (lat >= 37 && lat <= 42 && lng >= -114 && lng <= -109) return 'America/Denver';
      const off = Math.round(lng / 15);
      if (off >= -12 && off <= 12) return `Etc/GMT${off <= 0 ? '+' : '-'}${Math.abs(off)}`;
      return null;
    }

    function formatLocalTime(location, spot) {
      try {
        let tz = location.timeZone || location.timezone;
        const lat = location.coordinates?.latitude || spot?.location?.latitude;
        const lng = location.coordinates?.longitude || spot?.location?.longitude;
        if (!tz && lat && lng) tz = estimateTimezone(lat, lng);
        if (tz && location.localTime) {
          const t = new Date(location.localTime);
          if (!isNaN(t.getTime()))
            return t.toLocaleString('en-US', { timeZone: tz, weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
        }
        if (tz)
          return new Date().toLocaleString('en-US', { timeZone: tz, weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
        return 'Local time unavailable';
      } catch { return 'Local time unavailable'; }
    }

    function formatCoordinates(location, spot) {
      const lat = spot?.location?.latitude ?? location.coordinates?.latitude;
      const lng = spot?.location?.longitude ?? location.coordinates?.longitude;
      return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }

    // scoreLabel / formatHourDisplay / findBestWindow and the blended hourly
    // heatmap now live in /js/components/KonditionsHeatmap.js (shared).


    // Map warning text → Material Icon name + tint colour
    function getWarningMeta(text) {
      const t = text.toLowerCase();
      if (t.includes('cold') || t.includes('hypotherm') || t.includes('freeze') || t.includes('frost'))
        return { icon: 'thermometer', color: '#7dd3fc' };
      if (t.includes('uv') || t.includes('sunburn') || t.includes('solar'))
        return { icon: 'sun',         color: '#fbbf24' };
      if (t.includes('sun') || t.includes('heat') || t.includes('hot'))
        return { icon: 'sun',         color: '#fbbf24' };
      if (t.includes('wind') || t.includes('gust') || t.includes('breeze'))
        return { icon: 'wind',        color: '#a5f3fc' };
      if (t.includes('storm') || t.includes('thunder') || t.includes('lightning'))
        return { icon: 'spark',       color: '#f59e0b' };
      if (t.includes('wave') || t.includes('swell') || t.includes('chop'))
        return { icon: 'wave',        color: '#67e8f9' };
      if (t.includes('rain') || t.includes('precipit') || t.includes('shower'))
        return { icon: 'rain',        color: '#93c5fd' };
      if (t.includes('fog') || t.includes('mist') || t.includes('visib'))
        return { icon: 'eye',         color: '#d1d5db' };
      if (t.includes('water') || t.includes('current') || t.includes('flow') || t.includes('tide'))
        return { icon: 'droplet',     color: '#38bdf8' };
      if (t.includes('danger') || t.includes('hazard') || t.includes('extreme'))
        return { icon: 'alert',       color: '#f87171' };
      if (t.includes('caution') || t.includes('warning') || t.includes('risk'))
        return { icon: 'alert',       color: '#fbbf24' };
      return   { icon: 'info',        color: '#b5935a' };
    }

    // Group warnings into hazard categories so near-duplicate lines collapse to one.
    function categorize(text) {
      const t = text.toLowerCase();
      if (/cold|hypotherm|freez|frost/.test(t))  return { key:'cold',  label:'Cold water', icon:'thermometer' };
      if (/uv|sunburn|solar/.test(t))            return { key:'uv',    label:'UV',         icon:'sun' };
      if (/heat|hot|summer|sun/.test(t))         return { key:'heat',  label:'Heat',       icon:'sun' };
      if (/wind|gust|breeze/.test(t))            return { key:'wind',  label:'Wind',       icon:'wind' };
      if (/storm|thunder|lightning/.test(t))     return { key:'storm', label:'Storms',     icon:'spark' };
      if (/wave|swell|chop/.test(t))             return { key:'wave',  label:'Waves',      icon:'wave' };
      if (/rain|precip|shower/.test(t))          return { key:'rain',  label:'Rain',       icon:'rain' };
      if (/fog|mist|visib/.test(t))              return { key:'vis',   label:'Visibility', icon:'eye' };
      if (/water|current|flow|tide/.test(t))     return { key:'water', label:'Water',      icon:'droplet' };
      return { key:'other', label:'Conditions', icon:'info' };
    }

    // Server warning/penalty strings embed metric units (e.g. "Extreme heat (42.5°C)").
    // Localize via the shared KaaykoPrefs.localizeUnits (single source of truth).
    function localizeUnits(text) { return window.KaaykoPrefs.localizeUnits(text); }

    function renderTripBriefing(currentData, forecastData) {
      const container = document.getElementById('forecastAlertDrawer');
      if (!container) return;

      const warnings = window.dataTransformer?.prepareWarningsData?.(forecastData) || [];
      const warningItems = Array.isArray(warnings) ? warnings.map(String) : [warnings].filter(Boolean).map(String);
      const penalties = currentData?.paddleScore?.penaltiesApplied || currentData?.paddleScore?.penalties || [];
      penalties
        .filter(Boolean)
        .map(String)
        .forEach(item => {
          const clean = item.replace(/:\s*[-+]?\d+\.?\d*\s*(pts?)?$/i, '').trim();
          if (clean && !warningItems.some(existing => existing.toLowerCase() === clean.toLowerCase())) {
            warningItems.push(clean);
          }
        });

      // Collapse to ONE alert per hazard category. Within a category, prefer the line
      // that carries a number, so 3 near-identical "heat" lines become "Extreme heat (99°F)".
      const byCat = new Map();
      warningItems.forEach(w => {
        const cat = categorize(w);
        const hasNum = /\d/.test(w);
        const existing = byCat.get(cat.key);
        if (!existing || (hasNum && !existing.hasNum)) byCat.set(cat.key, { cat, text: w, hasNum });
      });
      const alerts = [...byCat.values()];

      if (!alerts.length) {
        container.innerHTML = '';
        container.hidden = true;
        return;
      }

      // Name the hazards instead of counting them: "Heat & wind", not "5 conditions".
      const labels = alerts.map(a => a.cat.label);
      let title;
      if (labels.length === 1)      title = labels[0];
      else if (labels.length === 2) title = `${labels[0]} & ${labels[1].toLowerCase()}`;
      else                          title = `${labels[0]}, ${labels[1].toLowerCase()} & ${labels.length - 2} more`;

      const itemsHTML = alerts.map(a => `
          <div class="alert-item">
            <span class="alert-item-icon" style="color:${getWarningMeta(a.text).color}" aria-hidden="true">${window.KaaykoIcons ? window.KaaykoIcons.get(a.cat.icon) : ''}</span>
            <span class="alert-item-text">${localizeUnits(a.text)}</span>
          </div>`).join('');

      container.hidden = false;
      container.innerHTML = `
        <section class="forecast-alert-banner is-closed" role="region" aria-label="Paddling alerts">
          <button class="alert-summary" type="button" aria-expanded="false">
            <span class="alert-mark">${alerts.length}</span>
            <span class="alert-summary-copy">
              <span class="briefing-kicker">Lake alerts</span>
              <span class="alert-summary-title">${title}</span>
            </span>
          </button>
          <button class="alert-dismiss" type="button" aria-label="Dismiss lake alerts">×</button>
          <div class="alert-details" hidden>
            <div class="alert-items">${itemsHTML}</div>
          </div>
        </section>
      `;

      const banner = container.querySelector('.forecast-alert-banner');
      const summary = container.querySelector('.alert-summary');
      const details = container.querySelector('.alert-details');
      summary?.addEventListener('click', () => {
        const isOpen = banner.classList.toggle('is-open');
        banner.classList.toggle('is-closed', !isOpen);
        summary.setAttribute('aria-expanded', String(isOpen));
        details.hidden = !isOpen;
      });
      container.querySelector('.alert-dismiss')?.addEventListener('click', () => {
        container.hidden = true;
      });
    }

    // ── Weather stats graphical bars ────────────────────────────────────────
    function enhanceWeatherStats() {
      const container = document.getElementById('ratingHeroContainer');
      if (!container) return;
      const stats = container.querySelectorAll('.weather-stat');
      if (!stats.length) return;

      const COMPASS = {N:0,NNE:22,NE:45,ENE:67,E:90,ESE:112,SE:135,SSE:157,
                       S:180,SSW:202,SW:225,WSW:247,W:270,WNW:292,NW:315,NNW:337};

      // ── Step 1: Remove recalculable elements; keep structural changes ──────
      container.querySelectorAll('.stat-bar-track').forEach(el => el.remove());

      // ── Step 2: Merge Wind Dir into Wind Speed (once per page load) ────────
      if (!container.dataset.windMerged) {
        const windSpeedStat = stats[1];  // index 1 = Wind Speed
        const windDirStat   = stats[2];  // index 2 = Wind Dir
        if (windSpeedStat && windDirStat) {
          const dirText = windDirStat.querySelector('.weather-value')?.textContent?.trim() || '';
          const labelEl = windSpeedStat.querySelector('.weather-label');
          if (dirText && dirText !== '--') {
            // Relabel to "Wind"
            if (labelEl) labelEl.textContent = 'Wind';
            // Inject compass arrow into .weather-data, between value and label
            const deg        = COMPASS[dirText.toUpperCase()] ?? 0;
            const compass    = document.createElement('div');
            compass.className = 'stat-compass';
            compass.innerHTML = `<span class="stat-compass-arrow" style="transform:rotate(${deg}deg)">↑</span>`;
            const weatherData = windSpeedStat.querySelector('.weather-data');
            if (weatherData && labelEl) {
              weatherData.insertBefore(compass, labelEl);
            } else {
              windSpeedStat.appendChild(compass);
            }
          }
          windDirStat.classList.add('stat-hidden');
        }
        container.dataset.windMerged = '1';
      }

      // ── Step 3: Hide Cloud Cover when absent or zero ──────────────────────
      const cloudStat  = stats[5];
      const cloudValue = cloudStat?.querySelector('.weather-value')?.textContent?.trim() || '';
      if (cloudStat) {
        const isAbsent = ['0%', '--', '', '--%', '0'].includes(cloudValue);
        cloudStat.classList.toggle('stat-hidden', isAbsent);
        if (!isAbsent) cloudStat.classList.add('stat-full-width');
        else            cloudStat.classList.remove('stat-full-width');
      }

      // ── Step 4: Add animated bars to visible stats ────────────────────────
      let barIdx = 0;
      stats.forEach(stat => {
        if (stat.classList.contains('stat-hidden')) return;
        const labelEl = stat.querySelector('.weather-label');
        const valueEl = stat.querySelector('.weather-value');
        if (!labelEl || !valueEl) return;

        const label     = labelEl.textContent.trim().toLowerCase();
        const valueText = valueEl.textContent.trim();
        const num       = parseFloat(valueText);
        if (isNaN(num)) { barIdx++; return; }

        let pct = 0, color = '#316d43';

        if (label === 'wind' || label.includes('wind speed')) {
          const v = valueText.includes('mph') ? num * 1.60934 : num;
          pct   = Math.min(100, (v / 40) * 100);
          color = v <= 15 ? '#316d43' : v <= 25 ? '#c59a61' : '#bd3b2b';
        } else if (label.includes('uv')) {
          pct   = Math.min(100, (num / 11) * 100);
          color = num <= 3 ? '#316d43' : num <= 6 ? '#c59a61' : '#bd3b2b';
        } else if (label.includes('water') || label.includes('air')) {
          const c = valueText.includes('°F') ? (num - 32) * 5/9 : num;
          pct   = Math.min(100, Math.max(0, ((c + 10) / 50) * 100));
          color = label.includes('water')
            ? (c >= 18 && c <= 28 ? '#316d43' : c >= 12 ? '#c59a61' : '#bd3b2b')
            : (c >= 15 && c <= 30 ? '#316d43' : c >= 8  ? '#c59a61' : '#bd3b2b');
        } else if (label.includes('cloud')) {
          pct   = Math.min(100, num);
          color = num <= 30 ? '#316d43' : num <= 70 ? '#c59a61' : '#bd3b2b';
        } else if (label.includes('humidity')) {
          pct   = Math.min(100, num);
          color = num >= 30 && num <= 70 ? '#316d43' : '#c59a61';
        } else if (label.includes('wave')) {
          const ft = valueText.toLowerCase().includes(' m') ? num * 3.28084 : num;
          pct   = Math.min(100, (ft / 6) * 100);
          color = ft <= 1 ? '#316d43' : ft <= 2.5 ? '#c59a61' : '#bd3b2b';
        } else { barIdx++; return; }

        const track = document.createElement('div');
        track.className = 'stat-bar-track';
        const fill = document.createElement('div');
        fill.className = 'stat-bar-fill';
        fill.style.cssText = `width:0;background:${color};box-shadow:0 0 8px ${color}90`;
        track.appendChild(fill);
        stat.appendChild(track);
        const delay = 120 + barIdx * 70;
        setTimeout(() => { fill.style.width = pct + '%'; }, delay);
        barIdx++;
      });
    }

    // ── Component renderers ─────────────────────────────────────────────────
    function renderHero(currentData, forecastData, spot) {
      if (!currentData?.paddleScore) return;
      const container = document.getElementById('ratingHeroContainer');
      if (!container) return;
      try {
        const ratingHero = new window.RatingHero();
        container.innerHTML = '';
        const rating = currentData.paddleScore.rating;
        const interpretation = {
          skillLevel: getSkillLevelFromRating(rating),
          recommendation: currentData.paddleScore.interpretation,
          details: `Confidence: ${currentData.paddleScore.confidence} | ML Model: ${currentData.paddleScore.mlModelUsed}`,
          penalties: currentData.paddleScore.penalties || [],
          originalRating: currentData.paddleScore.originalRating || rating,
          totalPenalty: currentData.paddleScore.totalPenalty || 0
        };
        const penaltiesApplied = (currentData.paddleScore.penaltiesApplied || []).slice();
        // Craft adjustment surfaces as a briefing row ("Adjusted for your SUP")
        const craftAdj = currentData.paddleScore.craftAdjustment;
        if (craftAdj && craftAdj.delta < 0) {
          penaltiesApplied.push(`Adjusted for your ${craftAdj.label}: ${craftAdj.delta}`);
        }
        const weather = {
          ...currentData.conditions,
          penalties: penaltiesApplied,
          originalRating: currentData.paddleScore.originalMLRating || rating,
          totalPenalty: penaltiesApplied.length > 0
            ? penaltiesApplied.reduce((s, p) => {
                const m = typeof p === 'string' ? p.match(/([-+]\d+\.?\d*)/) : null;
                return s + (m ? parseFloat(m[1]) : 0);
              }, 0)
            : 0,
          hasPenalties: penaltiesApplied.length > 0,
          isGoldStandard: currentData.paddleScore.isGoldStandard
        };
        const element = ratingHero.render(rating, interpretation, weather, forecastData, spot?.id || null);
        container.appendChild(element);
        // Inject graphical bars after render. Units no longer change on this page
        // (chosen in Settings), so there's no in-page unit-toggle to re-render for.
        requestAnimationFrame(enhanceWeatherStats);
      } catch (err) { console.error('RatingHero error:', err); }
    }


    function getAmenityItems(spot) {
      const yn = value => value === true || String(value).toUpperCase() === 'Y';
      const items = [
        { label: 'Parking', available: yn(spot?.parkingAvl) },
        { label: 'Restrooms', available: yn(spot?.restroomsAvl) }
      ];
      const extra = spot?.amenities;
      if (extra && typeof extra === 'object') {
        Object.keys(extra).forEach(key => {
          if (['parking', 'restrooms'].includes(key)) return;
          items.push({
            label: key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()),
            available: yn(extra[key])
          });
        });
      }
      return items;
    }

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Enrichment rows — rendered ONLY when the spot doc actually carries the data.
    // No data → no row: contextual info here is always real, never inferred.
    function enrichmentRows(spot) {
      const rows = [];
      if (spot?.waterType === 'river' || spot?.waterType === 'lake' || spot?.waterType === 'ramp') {
        const label = { river: 'River', lake: 'Lake', ramp: 'Boat ramp' }[spot.waterType];
        rows.push(`<div class="loc-row"><span class="loc-label">Water</span><span>${label}</span></div>`);
      }
      if (spot?.launchHint) {
        rows.push(`<div class="loc-row"><span class="loc-label">Launch</span><span>${esc(spot.launchHint)}</span></div>`);
      }
      // Live river data from the spot's USGS gauge (server-attached, cache-backed)
      const hyd = spot?.hydrologyNow;
      if (hyd && hyd.discharge && window.KaaykoPrefs?.fmtFlow) {
        const P = window.KaaykoPrefs;
        const MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const month = MONTHS[new Date().getMonth() + 1];
        const bandPhrase = {
          high: `Running well above normal — ${hyd.pctOfNormal ?? '90+'}th percentile for ${month}`,
          above: `Running above normal — ${hyd.pctOfNormal}th percentile for ${month}`,
          normal: `Normal range for ${month}`,
          below: `Running below normal — ${hyd.pctOfNormal}th percentile for ${month}`,
          low: `Low water — ${hyd.pctOfNormal}th percentile for ${month}`
        }[hyd.pctOfNormalBand] || null;
        const staleNote = hyd.stale ? ' <em>(gauge last reported over a day ago)</em>' : '';
        const gaugeLink = hyd.gaugeUrl
          ? ` <a class="loc-coords-link" href="${esc(hyd.gaugeUrl)}" target="_blank" rel="noopener">USGS gauge →</a>` : '';
        rows.push(`<div class="loc-row"><span class="loc-label">River flow</span><span class="flow-${esc(hyd.pctOfNormalBand || 'unknown')}">${P.fmtFlow(hyd.discharge.cms)}${bandPhrase ? ' — ' + bandPhrase : ''}${staleNote}${gaugeLink}</span></div>`);
        if (hyd.gageHeight && P.fmtHeight) {
          rows.push(`<div class="loc-row"><span class="loc-label">Water level</span><span>${P.fmtHeight(hyd.gageHeight.m)}</span></div>`);
        }
      }
      const cov = spot?.cellCoverage;
      if (cov && ['good', 'patchy', 'none'].includes(cov.grade)) {
        const text = cov.grade === 'good'
          ? 'Good coverage near the launch'
          : cov.grade === 'patchy'
            ? 'Patchy signal — download offline maps'
            : 'No signal at the water — download offline maps';
        rows.push(`<div class="loc-row"><span class="loc-label">Cell signal</span><span class="cov-${cov.grade}">${text}</span></div>`);
      }
      return rows.join('');
    }

    // "Prep" — preparation tips from the server's tips engine (real conditions +
    // craft + spot facts). Values arrive metric; formatted here per units pref.
    let __prepTips = [];
    function renderPrepBlock(tips) {
      if (tips) __prepTips = tips;
      document.querySelectorAll('.prep-block').forEach(el => el.remove());
      const list = (__prepTips || []).filter(t => t && t.title);
      if (list.length === 0) return;
      const host = document.getElementById('prepStack');
      if (!host) return;
      const P = window.KaaykoPrefs;
      const block = document.createElement('div');
      block.className = 'kbg-block prep-block';
      block.innerHTML =
        '<div class="kbg-title">Prep</div>' +
        list.map(t => {
          let detail = String(t.detail || '');
          if (t.values && t.values.waterLiters != null && P?.fmtVolume) {
            detail = detail.replace('{water}', P.fmtVolume(t.values.waterLiters));
          }
          const icon = window.KaaykoIcons?.get?.(t.icon || 'info') || '';
          return `<div class="kbg-row${t.priority === 1 ? ' prep-p1' : ''}"><span class="kbg-icon">${icon}</span>` +
                 `<span><strong>${esc(t.title)}</strong><br>${esc(detail)}</span></div>`;
        }).join('');
      host.appendChild(block);
    }
    window.addEventListener('kaayko:unitschange', () => renderPrepBlock());

    // "Know before you go" — Rohan-authored spot facts, shown only when present.
    function renderLocalTips(spot) {
      const host = document.getElementById('prepStack');
      const tips = Array.isArray(spot?.localTips) ? spot.localTips.filter(t => t && t.text) : [];
      document.querySelectorAll('.kbg-block:not(.prep-block)').forEach(el => el.remove()); // idempotent re-render
      if (!host || tips.length === 0) return;
      const ICONS = { launch: 'pin', hazard: 'alert', season: 'sun', general: 'info' };
      const block = document.createElement('div');
      block.className = 'kbg-block';
      block.innerHTML =
        '<div class="kbg-title">Know before you go</div>' +
        tips.slice(0, 4).map(t => {
          const icon = window.KaaykoIcons?.get?.(ICONS[t.category] || 'info') || '';
          return `<div class="kbg-row kbg-${esc(t.category || 'general')}"><span class="kbg-icon">${icon}</span><span>${esc(t.text)}</span></div>`;
        }).join('');
      host.appendChild(block);
    }

    let __lastLocInfo = null;
    window.addEventListener('kaayko:unitschange', () => {
      if (__lastLocInfo) renderLocationInfo(__lastLocInfo.location, __lastLocInfo.spot);
    });

    function renderLocationInfo(location, spot) {
      if (!location) return;
      __lastLocInfo = { location, spot };
      const amenities = getAmenityItems(spot);

      // Coordinates → tappable, opens that exact point on a map
      const lat = spot?.location?.latitude ?? location.coordinates?.latitude;
      const lng = spot?.location?.longitude ?? location.coordinates?.longitude;
      const hasCoords = Number.isFinite(Number(lat)) && Number.isFinite(Number(lng));
      const pinSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>';
      const coordsCell = hasCoords
        ? `<a class="loc-coords-link" href="https://www.google.com/maps/search/?api=1&query=${Number(lat)},${Number(lng)}" target="_blank" rel="noopener" title="Open this point on a map">${Number(lat).toFixed(4)}, ${Number(lng).toFixed(4)} ${pinSvg}</a>`
        : formatCoordinates(location, spot);

      // YouTube — shown only when the lake has a valid video link
      const yt = spot?.youtubeURL;
      const ytOk = typeof yt === 'string' && /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(yt);
      const playSvg = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      const ytRow = ytOk
        ? `<div class="loc-row"><span class="loc-label">Video</span><span><a class="loc-yt-link" href="${yt.replace(/"/g, '%22')}" target="_blank" rel="noopener">${playSvg} Watch on YouTube</a></span></div>`
        : '';

      document.getElementById('locationInfo').innerHTML = `
        <div class="card-eyebrow">The Spot</div>
        <div class="loc-row"><span class="loc-label">Region</span><span>${location.region || '—'}, ${location.country || '—'}</span></div>
        <div class="loc-row"><span class="loc-label">Local Time</span><span>${formatLocalTime(location, spot)}</span></div>
        <div class="loc-row"><span class="loc-label">Coordinates</span><span>${coordsCell}</span></div>
        ${enrichmentRows(spot)}
        ${ytRow}
        <div class="loc-row loc-amenities"><span class="loc-label">Amenities</span><span class="amenities-list">
          ${amenities.map(item => `<span class="amenity-pill ${item.available ? 'available' : 'unavailable'}">${item.available ? '✓' : '—'} ${item.label}</span>`).join('')}
        </span></div>
      `;
      renderLocalTips(spot);
      renderPrepBlock(Array.isArray(spot?.tips) ? spot.tips : []);
    }

    function renderApiStatus(forecastData) {
      const mlIcon = window.dataTransformer?.getMLStatusIcon?.(forecastData) || '🤖';
      const responseTime = forecastData.metadata?.responseTime || 'N/A';
      const current = window.dataTransformer?.extractCurrentConditions?.(forecastData);
      const source = current?.mlModelUsed === true || current?.predictionSource === 'ml-model'
        ? 'ML forecast'
        : 'Estimated forecast';
      document.getElementById('apiStatus').innerHTML =
        `${mlIcon} ${source} &nbsp;|&nbsp; ${responseTime}`;
    }

    // ── Main load logic ─────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const spotId    = params.get('id');
    let   customLat = params.get('lat');
    let   customLng = params.get('lng');
    // A favorite saved from a generic (lat/lng) lake is stored with id
    // "custom_<lat>_<lng>". Recover the coordinates so it reopens as that lake
    // instead of 404-ing on a DB lookup.
    if ((!customLat || !customLng) && spotId && spotId.indexOf('custom_') === 0) {
      const parts = spotId.split('_');
      if (parts.length >= 3) { customLat = parts[1]; customLng = parts[2]; }
    }
    let currentSpot = null;

    function showError() {
      document.getElementById('forecastLoading').style.display = 'none';
      document.getElementById('forecastError').style.display = 'flex';
    }

    async function loadForecast() {
      document.getElementById('forecastLoading').style.display = 'flex';
      document.getElementById('forecastError').style.display = 'none';
      document.getElementById('forecastContent').style.display = 'none';

      if (!spotId && !(customLat && customLng)) { showError(); return; }

      const apiBase = getApiBase();

      try {
        let spot;

        if (customLat && customLng) {
          // ── Custom location from search page (no DB entry) ──────────────
          const name = params.get('name') || 'Custom Location';
          const type = params.get('type') || '';
          spot = {
            id: `custom_${customLat}_${customLng}`,
            title: name,
            subtitle: type,
            isCustom: true,
            location: { latitude: parseFloat(customLat), longitude: parseFloat(customLng) },
            imgSrc: []
          };
        } else {
          // ── Known spot from paddling-out DB ─────────────────────────────
          const spotUrl = `${apiBase}/paddlingOut/${encodeURIComponent(spotId)}`;
          const spotRes = await fetch(window.KaaykoPrefs?.withCraft ? window.KaaykoPrefs.withCraft(spotUrl) : spotUrl);
          if (!spotRes.ok) throw new Error('Spot not found');
          spot = await spotRes.json();
        }

        currentSpot = spot;

        // Update title + OG tags immediately so shares reflect the actual lake
        document.getElementById('forecastLakeName').textContent = spot.title;
        document.getElementById('forecastLakeLocation').textContent = spot.subtitle || '';

        // Favorite ★ toggle in the header
        const favSlot = document.getElementById('forecastFavSlot');
        if (favSlot && window.KaaykoPrefs) {
          favSlot.innerHTML = '';
          favSlot.appendChild(window.KaaykoPrefs.makeFavButton({
            id: spot.id, title: spot.title, subtitle: spot.subtitle
          }));
        }
        document.title = `${spot.title} Paddle Forecast | Kaayko`;
        // Update Open Graph / Twitter meta for social sharing
        const _ogTitle    = `${spot.title} Paddle Conditions | Kaayko`;
        const _ogDesc     = `Live AI paddle score for ${spot.title}${spot.subtitle ? ', ' + spot.subtitle : ''}. Wind, water temp, UV index, and 3-day hourly forecast.`;
        const _canonUrl   = `https://kaayko.com/paddlingout/forecast?id=${encodeURIComponent(spot.id)}`;
        const _setMeta    = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
        _setMeta('meta[property="og:title"]',         _ogTitle);
        _setMeta('meta[property="og:description"]',   _ogDesc);
        _setMeta('meta[property="og:url"]',           _canonUrl);
        _setMeta('meta[name="twitter:title"]',        _ogTitle);
        _setMeta('meta[name="twitter:description"]',  _ogDesc);

        // Pick a random image from the spot's gallery for the hero + page bg
        const imgs = Array.isArray(spot.imgSrc) && spot.imgSrc.length ? spot.imgSrc : [];
        const heroSrc = imgs.length
          ? imgs[Math.floor(Math.random() * imgs.length)]
          : (spot.headerImage || spot.coverImage || null);

        if (heroSrc) {
          // Full-page ultra-faint ambient background
          document.querySelector('.forecast-lake-bg')?.remove();
          const bgEl = document.createElement('div');
          bgEl.className = 'forecast-lake-bg';
          bgEl.style.backgroundImage = `url(${heroSrc})`;
          document.body.prepend(bgEl);

          // Hero image inside the page header
          document.querySelector('.forecast-hero-bg')?.remove();
          const heroEl = document.createElement('div');
          heroEl.className = 'forecast-hero-bg';
          heroEl.style.backgroundImage = `url(${heroSrc})`;
          document.querySelector('.forecast-page-header')?.prepend(heroEl);
        }

        // 2. ONE source of truth for "NOW": known spots render the SAME
        //    craft-adjusted cached score the list page shows (already in the
        //    /paddlingOut/:id response) — a second scoring call here produced
        //    a different number than the card the user just tapped.
        //    The coordinate path survives only for custom lat/lng spots.
        const currentFromSpot = spot?.paddleScore ? Promise.resolve({
          success: true,
          paddleScore: spot.paddleScore,
          conditions: spot.paddleScore.conditions,
          warnings: spot.paddleScore.warnings,
          tips: spot.tips || [],
          metadata: {
            source: spot.paddleScore.predictionSource,
            cached: true,
            cachedAt: spot.paddleScore.computedAt
          }
        }) : null;

        const [currentData, forecastData] = await Promise.all([
          (currentFromSpot || window.apiClient.getCurrentData(spot.location.latitude, spot.location.longitude))
            .catch(e => { console.warn('getCurrentData failed:', e); return null; }),
          window.apiClient.getFastForecast(spot.location.latitude, spot.location.longitude)
            .catch(e => { console.warn('getFastForecast failed:', e); return null; })
        ]);

        if (!currentData && !forecastData) throw new Error('Both API calls failed');

        // 3. Render what we have
        window.__kaaykoCurrentData = currentData;
        if (currentData) renderHero(currentData, forecastData, spot);
        renderTripBriefing(currentData, forecastData);
        if (forecastData) window.KonditionsHeatmap.render(
          document.getElementById('heatmapContainer'), forecastData, window.__kaaykoCurrentData);
        if (forecastData?.location) renderLocationInfo(forecastData.location, spot);
        if (forecastData) renderApiStatus(forecastData);

        // 4. Show content
        document.getElementById('forecastLoading').style.display = 'none';
        document.getElementById('forecastContent').style.display = 'flex';

      } catch (err) {
        console.error('Forecast page error:', err);
        showError();
      }
    }

    // Retry
    document.getElementById('retryBtn').addEventListener('click', loadForecast);

    // Dismiss drawers / popovers when clicking outside them
    document.addEventListener('click', function (e) {
      // Close alert drawer expand if open and click is outside
      const alertDrawer = document.getElementById('forecastAlertDrawer');
      if (alertDrawer && !alertDrawer.hidden && !alertDrawer.contains(e.target)) {
        const banner = alertDrawer.querySelector('.forecast-alert-banner.is-open');
        if (banner) {
          banner.classList.remove('is-open');
          banner.classList.add('is-closed');
          banner.querySelector('.alert-summary')?.setAttribute('aria-expanded', 'false');
          const details = banner.querySelector('.alert-details');
          if (details) details.hidden = true;
        }
      }

      // Clear blended heatmap when clicking outside
      const heatmapContainer = document.getElementById('heatmapContainer');
      if (heatmapContainer && !heatmapContainer.contains(e.target)) {
        heatmapContainer.querySelectorAll('.khm-hit').forEach(h => h.classList.remove('is-active'));
        heatmapContainer.querySelectorAll('.khm-bar').forEach(b => b.classList.remove('has-sel'));
        heatmapContainer.querySelectorAll('.khm-cursor').forEach(c => c.classList.remove('visible'));
        heatmapContainer.querySelectorAll('.khm-panel').forEach(p => { p.hidden = true; });
      }
    });

    // Boot
    loadForecast();
  </script>

  <!-- Smart back navigation: returns to wherever user came from -->
  <script>
    (function () {
      const btn = document.getElementById('forecastBackBtn');
      if (!btn) return;
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        // If there's real history to go back to (user navigated here from within the site),
        // use browser back so search results, main grid, etc. are preserved.
        // Fall back to /paddlingout for direct links / bookmarks.
        if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.hostname)) {
          window.history.back();
        } else {
          window.location.href = '/paddlingout';
        }
      });
    })();
  </script>

  <!-- Header scroll hide/show -->
  <script>
    (function () {
      const header = document.querySelector('.header');
      if (!header) return;
      let lastY = 0, ticking = false;
      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          const y = window.scrollY;
          if (y > 90 && y > lastY) header.classList.add('header-hidden');
          else header.classList.remove('header-hidden');
          lastY = y;
          ticking = false;
        });
      }, { passive: true });
    })();
  </script>
  <script>
    /* kaayko-footer-year */
    (function () {
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>

</body>
</html>

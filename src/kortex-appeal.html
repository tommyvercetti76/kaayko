<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Request a review · Kortex</title>
  <style>
    :root { --bg:#080808; --card:#0d0d0d; --line:#1e1e1e; --ink:#f0f0f0; --dim:#9a9a9a; --faint:#555; --gold:#D4A84B; --err:#e05a4f; --ok:#5fc48f; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:480px;width:100%;border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--card)}
    h1{font-size:22px;margin-bottom:8px}
    p{color:var(--dim);line-height:1.6;font-size:14.5px}
    form{margin-top:20px;display:flex;flex-direction:column;gap:14px}
    label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
    input,textarea{width:100%;background:#111;border:1px solid #262626;border-radius:10px;color:var(--ink);padding:11px 12px;font:inherit;font-size:15px}
    input:focus,textarea:focus{outline:none;border-color:var(--gold)}
    textarea{min-height:120px;resize:vertical}
    code{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#cfcfcf;background:#161616;padding:2px 6px;border-radius:4px}
    button{background:var(--gold);color:#080808;font-weight:700;border:0;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer}
    button:disabled{opacity:.4;cursor:not-allowed}
    .msg{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5}
    .msg.show{display:block}
    .msg.ok{background:rgba(95,196,143,.12);border:1px solid rgba(95,196,143,.4);color:var(--ok)}
    .msg.err{background:rgba(224,90,79,.12);border:1px solid rgba(224,90,79,.4);color:var(--err)}
    .foot{margin-top:18px;font-size:12px;color:var(--faint)}
    .foot a{color:var(--gold);text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Request a review</h1>
    <p>Kortex checks every destination before and after a link goes live. If a link you own is under review or was blocked by mistake, tell us who you are and where it points. A person reads every request.</p>
    <form id="appeal-form">
      <div>
        <label for="code">Link code</label>
        <input id="code" name="code" required pattern="[A-Za-z0-9_-]{3,80}" placeholder="e.g. lk7f2q">
      </div>
      <div>
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required placeholder="you@organisation.com" autocomplete="email">
      </div>
      <div>
        <label for="message">What should we know?</label>
        <textarea id="message" name="message" required minlength="10" placeholder="Who you are, what the destination is, and why it should be live."></textarea>
      </div>
      <button type="submit" id="submit">Send request</button>
      <div id="msg" class="msg" role="status"></div>
    </form>
    <div class="foot">Kortex by <a href="https://kaayko.com">Kaayko</a> · <a href="/legal/kortex-terms">Terms</a></div>
  </main>
  <script>
    const API_BASE = (localStorage.getItem('kaayko_environment') || 'production') === 'production'
      ? 'https://api-vwcc5j4qda-uc.a.run.app'
      : 'http://127.0.0.1:5001/kaaykostore/us-central1/api';
    const params = new URLSearchParams(window.location.search);
    const codeInput = document.getElementById('code');
    if (params.get('code')) codeInput.value = params.get('code').slice(0, 80);

    const form = document.getElementById('appeal-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch(`${API_BASE}/kortex/appeals`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: codeInput.value.trim(),
            email: document.getElementById('email').value.trim(),
            message: document.getElementById('message').value.trim()
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data.error || 'Could not send the request.');
        msg.textContent = data.message || 'Thanks. A reviewer will look at this link.';
        msg.className = 'msg ok show';
        btn.textContent = 'Sent';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg err show';
        btn.disabled = false; btn.textContent = 'Send request';
      }
    });
  </script>
</body>
</html>

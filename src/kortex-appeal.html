<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Request a review · Kortex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
  <style>
    :root { --bg:#080808; --card:rgba(5,7,14,.78); --line:rgba(181,147,90,.24); --ink:#ede8df; --dim:rgba(237,232,223,.76); --faint:rgba(237,232,223,.62); --gold:#b5935a; --gold-bright:#d9bd7b; --err:#f28b84; --ok:#5fc48f; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;background:linear-gradient(180deg,#060b1e 0%,#0a1233 45%,#0a1129 70%,#080808 100%) fixed;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{position:relative;max-width:520px;width:100%;border:1px solid var(--line);padding:32px 30px;background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 30px 80px rgba(0,0,0,.4)}
    .card::after{content:'';position:absolute;inset:-1px;pointer-events:none;opacity:.85;--t:linear-gradient(var(--gold-bright),var(--gold-bright));background:var(--t) left top/18px 1px no-repeat,var(--t) left top/1px 18px no-repeat,var(--t) right top/18px 1px no-repeat,var(--t) right top/1px 18px no-repeat,var(--t) left bottom/18px 1px no-repeat,var(--t) left bottom/1px 18px no-repeat,var(--t) right bottom/18px 1px no-repeat,var(--t) right bottom/1px 18px no-repeat}
    h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:38px;letter-spacing:.06em;margin-bottom:8px;text-shadow:0 0 18px rgba(181,147,90,.2)}
    p{color:var(--dim);line-height:1.6;font-size:17px;font-style:italic}
    form{margin-top:22px;display:flex;flex-direction:column;gap:16px}
    label{display:block;font-size:13px;font-style:italic;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    input,textarea,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);padding:10px 2px;font:inherit;font-size:17px}
    select{color-scheme:dark}
    select option{background:#0a0f1f}
    input::placeholder,textarea::placeholder{color:rgba(237,232,223,.46);font-style:italic}
    input:focus,textarea:focus,select:focus{outline:1px solid var(--gold-bright);outline-offset:4px;border-bottom-color:var(--gold)}
    textarea{min-height:120px;resize:vertical}
    code{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink)}
    button{background:var(--gold);color:#080808;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:uppercase;border:0;padding:14px 22px;min-height:44px;cursor:pointer}
    button:hover:not(:disabled){background:var(--gold-bright)}
    button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:4px}
    button:disabled{opacity:.4;cursor:not-allowed}
    .honey{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
    .targets{margin-top:14px;display:grid;gap:6px;font-size:16px;color:var(--dim);font-style:italic}
    .targets b{color:var(--ink);font-weight:500}
    .msg{display:none;margin-top:14px;padding:10px 14px;border-left:2px solid var(--gold);font-size:16px;line-height:1.5;font-style:italic}
    .msg.show{display:block}
    .msg.ok{color:var(--ok);border-left-color:var(--ok)}
    .msg.err{color:var(--err);border-left-color:var(--err)}
    .foot{margin-top:20px;font-size:14px;color:var(--faint);font-style:italic;line-height:1.6}
    .foot a{color:var(--gold);text-decoration:none}
    .foot a:hover{color:var(--gold-bright)}
  </style>
</head>
<body>
  <main class="card">
    <h1>Request a review</h1>
    <p>Kortex checks every destination before and after a link goes live. If a link you own is under review or was blocked by mistake, tell us who you are and where it points. A person reads every request.</p>
    <form id="appeal-form">
      <div>
        <label for="code">Link code</label>
        <input id="code" name="code" required pattern="[A-Za-z0-9_-]{3,80}" placeholder="e.g. lk7f2q">
      </div>
      <div>
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required placeholder="you@organisation.com" autocomplete="email">
      </div>
      <div>
        <label for="message">What should we know?</label>
        <textarea id="message" name="message" required minlength="10" placeholder="Who you are, what the destination is, and why it should be live."></textarea>
      </div>
      <button type="submit" id="submit">Send request</button>
      <div id="msg" class="msg" role="status"></div>
    </form>
    <div class="foot">Kortex by <a href="https://kaayko.com">Kaayko</a> · <a href="/legal/kortex-terms">Terms</a></div>
  </main>
  <script>
    const API_BASE = (localStorage.getItem('kaayko_environment') || 'production') === 'production'
      ? 'https://api-vwcc5j4qda-uc.a.run.app'
      : 'http://127.0.0.1:5001/kaaykostore/us-central1/api';
    const params = new URLSearchParams(window.location.search);
    const codeInput = document.getElementById('code');
    if (params.get('code')) codeInput.value = params.get('code').slice(0, 80);

    const form = document.getElementById('appeal-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const res = await fetch(`${API_BASE}/kortex/appeals`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: codeInput.value.trim(),
            email: document.getElementById('email').value.trim(),
            message: document.getElementById('message').value.trim()
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data.error || 'Could not send the request.');
        msg.textContent = data.message || 'Thanks. A reviewer will look at this link.';
        msg.className = 'msg ok show';
        btn.textContent = 'Sent';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg err show';
        btn.disabled = false; btn.textContent = 'Send request';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Mail — Kaayko</title>
<meta name="description" content="Hold to climb. Deliver the letters. It does not end.">
<meta name="theme-color" content="#0B0A08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet">
<style>
/* Night Mail — the endless run. Nothing here touches the scored Mail Run on a
   product page; that game is worth money and is replayed server-side, so this
   one shares no code with it and posts nothing anywhere. */
:root {
  --ink: #0B0A08; --paper: #F4EEDF; --gold: #B5935A; --gold-lit: #F0D9A0;
  --dim: rgba(244,238,223,.5); --hair: rgba(181,147,90,.22);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Josefin Sans', Futura, Avenir, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--paper); }
body { font-family: var(--serif); min-height: 100svh; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.cap { font-family: var(--sans); font-weight: 300; font-size: 10.5px;
       letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }

.wrap { min-height: 100svh; display: grid; place-items: center; padding: 20px;
        padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.game { width: min(96vw, 860px); display: grid; gap: 14px; }

.head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
.head h1 { margin: 0; font-weight: 300; font-size: clamp(22px, 4vw, 32px); }
.stats { display: flex; gap: 18px; align-items: baseline; }
.stats b { font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }

.stage { position: relative; aspect-ratio: 16 / 9; border-radius: 12px;
         overflow: hidden; border: 1px solid var(--hair); background: #05070f; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* Every overlay is a real menu with a way out, never a dead end. */
.menu { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px;
        justify-items: center; text-align: center; padding: 22px;
        background: rgba(6,7,14,.86); backdrop-filter: blur(3px); }
.menu[hidden] { display: none; }
.menu h2 { margin: 0; font-weight: 300; font-size: clamp(24px, 5vw, 38px); }
.menu p { margin: 0; color: var(--dim); max-width: 40ch; line-height: 1.6; font-size: 16px; }
.opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.opt { padding: 10px 20px; border: 1px solid var(--hair); border-radius: 999px;
       background: transparent; color: var(--paper); cursor: pointer;
       font-family: var(--sans); font-weight: 300; font-size: 11px;
       letter-spacing: .18em; text-transform: uppercase; }
.opt:hover { border-color: var(--gold); color: var(--gold-lit); }
.opt.is-primary { background: var(--gold-lit); color: var(--ink); border-color: var(--gold-lit); }
.opt:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.key { width: 100%; padding: 18px; border: 1px solid var(--gold); border-radius: 12px;
       background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold-lit);
       font-family: var(--sans); font-size: 13px; letter-spacing: .16em;
       text-transform: uppercase; cursor: pointer;
       touch-action: none; user-select: none; -webkit-user-select: none;
       -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.key.is-down { background: var(--gold-lit); color: var(--ink); }
.key:disabled { opacity: .35; cursor: default; }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.rules { color: var(--dim); font-size: 15px; line-height: 1.6; margin: 0; }
@media (prefers-reduced-motion: reduce) { .menu { backdrop-filter: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="game">

    <div class="head">
      <h1>Night Mail</h1>
      <div class="stats">
        <span class="cap">Delivered <b id="score">0</b></span>
        <span class="cap">Best <b id="best">0</b></span>
        <span class="cap" id="stage">Fair weather</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="cv" aria-label="Night Mail. Hold to climb and collect the letters."></canvas>

      <div class="menu" id="menu">
        <p class="cap" id="m-kicker">Kaayko &middot; endless</p>
        <h2 id="m-title">Night Mail</h2>
        <p id="m-body">Hold to climb, let go to fall. Collect the letters, miss the towers.
          It does not end, and every ten deliveries it gets worse.</p>
        <div class="opts" id="m-opts"></div>
      </div>
    </div>

    <button type="button" class="key" id="key" disabled>Hold to climb</button>

    <div class="foot">
      <p class="rules cap">Space or hold &middot; Esc to pause</p>
      <p class="rules cap"><a href="/card">Back to the cards</a></p>
    </div>

  </div>
</main>

<script type="module">
import { endless, stageAt } from '/js/arcade/endless.js';

const cv = document.getElementById('cv');
const menu = document.getElementById('menu');
const opts = document.getElementById('m-opts');
const key = document.getElementById('key');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const stageEl = document.getElementById('stage');

const BEST_KEY = 'kaayko.nightmail.best';
let best = 0;
try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (_) {}
bestEl.textContent = best;

const game = endless(cv, {
  onScore(n) { scoreEl.textContent = n; stageEl.textContent = game.stageName; },
  onEnd(r) {
    if (r.score > best) {
      best = r.score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
      bestEl.textContent = best;
    }
    show('over', r);
  }
});

/* ── menus ───────────────────────────────────────────────────────────────────
   Every state has one, and every one lists the ways out. Nothing here can trap
   you behind an overlay with no button.                                       */
const SCREENS = {
  start: () => ({
    kicker: 'Kaayko &middot; endless',
    title: 'Night Mail',
    body: 'Hold to climb, let go to fall. Collect the letters, miss the towers. ' +
          'It does not end, and every ten deliveries it gets worse.',
    opts: [['Start flying', () => begin(), true],
           ['How it works', () => show('how')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  }),
  how: () => ({
    kicker: 'How it works',
    title: 'It gets worse on purpose',
    body: '10 crosswinds &middot; 20 mail sacks &middot; 30 moving towers &middot; 40 night. ' +
          'One new thing at a time, so you meet each of them alone first.',
    opts: [['Start flying', () => begin(), true],
           ['Back', () => show('start')]]
  }),
  paused: () => ({
    kicker: 'Paused',
    title: `${game.score} delivered`,
    body: 'Nothing is lost. Pick one.',
    opts: [['Resume', () => { hide(); game.resume(); key.disabled = false; }, true],
           ['Start again', () => begin()],
           ['How it works', () => show('how')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  }),
  over: (r) => ({
    kicker: r.score >= best && r.score > 0 ? 'A new best' : 'Down',
    title: `${r.score} delivered`,
    body: r.score === 0 ? 'The first tower is the hardest one. Hold earlier than feels right.'
        : `You went down in ${r.stage.toLowerCase()}. Best so far is ${best}.`,
    opts: [['Fly again', () => begin(), true],
           ['How it works', () => show('how')],
           ['Back to the cards', () => { location.href = '/card'; }]]
  })
};

function show(which, arg) {
  const s = SCREENS[which](arg);
  document.getElementById('m-kicker').innerHTML = s.kicker;
  document.getElementById('m-title').textContent = s.title;
  document.getElementById('m-body').innerHTML = s.body;
  opts.innerHTML = '';
  for (const [label, fn, primary] of s.opts) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (primary ? ' is-primary' : '');
    b.textContent = label;
    b.addEventListener('click', fn);
    opts.appendChild(b);
  }
  menu.hidden = false;
  key.disabled = true;
  opts.querySelector('.opt')?.focus({ preventScroll: true });
}
const hide = () => { menu.hidden = true; };

function begin() {
  hide();
  scoreEl.textContent = '0';
  stageEl.textContent = stageAt(0).name;
  key.disabled = false;
  game.start();
}

/* ── holding ─────────────────────────────────────────────────────────────── */
const holdOn = (e) => {
  if (key.disabled || menu.hidden === false) return;
  e.preventDefault();
  key.classList.add('is-down');
  game.hold(true);
};
const holdOff = () => { key.classList.remove('is-down'); game.hold(false); };

for (const el of [key, cv]) {
  el.addEventListener('pointerdown', (e) => { el.setPointerCapture?.(e.pointerId); holdOn(e); });
  el.addEventListener('pointerup', holdOff);
  el.addEventListener('pointercancel', holdOff);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
window.addEventListener('pointerup', holdOff);

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if (menu.hidden && game.pause()) show('paused');
    return;
  }
  if ((e.code === 'Space' || e.code === 'ArrowUp') && menu.hidden) {
    e.preventDefault(); if (!e.repeat) { key.classList.add('is-down'); game.hold(true); }
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') holdOff();
});
// Losing the window mid-flight pauses rather than quietly killing the run.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && menu.hidden && game.pause()) show('paused');
});

show('start');
</script>
</body>
</html>

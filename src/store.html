<html lang="en" prefix="og: http://ogp.me/ns# product: http://ogp.me/ns/product#">
<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="twitter:title" content="Kaayko Store - Outdoor Apparel">
  <meta name="twitter:description" content="Unique paddling gear and adventure apparel. Vote for designs, buy favorites.">
  <meta name="twitter:image" content="https://kaayko.com/assets/store-twitter.png">
  
  <!-- Schema.org Store -->

  <!-- 4) Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="/css/footer.css">
  <!-- Store-only domain (kaay.store): hide the shop until the invite code is
       accepted. Runs synchronously in <head> so the catalogue never flashes
       before the gate appears. secretStore.js opens the prompt and clears
       .store-locked on success. -->
  <style>
    html.store-locked body > .skip-link,
    html.store-locked body > header,
    html.store-locked body > main,
    html.store-locked body > footer { visibility: hidden; }
  </style>
  <script>
    (function () {
      var STORE_DOMAINS = ['kaay.store', 'www.kaay.store',
                           'kaay-store.web.app', 'kaay-store.firebaseapp.com'];
      if (STORE_DOMAINS.indexOf(location.hostname) === -1) return;
      var p = location.pathname;
      if (p !== '/' && p !== '/index.html') return;
      var params = new URLSearchParams(location.search);
      if (params.get('bypass') === 'kortex' && params.has('ref')) return;
      try {
        if (localStorage.getItem('kaaykoStoreAccess') === 'granted') return;
      } catch (e) { /* private mode — fall through and lock */ }
      document.documentElement.classList.add('store-locked');
    })();
  </script>
  <link rel="stylesheet" href="/css/pdp-motion.css" />
  <script src="/js/pdp-motion.js"></script>
</head>

<body class="store-v2">
  <a class="skip-link" href="#main">Skip to products</a>
  <!-- HEADER (shared across all pages) -->
  <header class="header">
    <div class="header-top">
      <!-- Brand -->
      <div class="header-brand">
        <h1 class="header-title">Kaayko</h1>
        <p class="header-subtitle">Made for the Wild</p>
      </div>
      <!-- Desktop navigation -->
      <nav class="top-menu"><ul></ul></nav>
      <!-- Controls: Filter | Dark-mode | Mobile menu -->
      <div class="header-controls">
        <!-- Filter Toggle -->
        <button id="filter-toggle" aria-label="Open filters">
          <svg class="header-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M7 12h10" />
            <path d="M10 17h4" />
          </svg>
        </button>
        <!-- Universal Theme Toggle -->
        <button class="theme-toggle-icon" aria-label="Switch theme"></button>
        <!-- Mobile FAB -->
        <button class="fab-menu mobile-only" aria-label="Open menu">
          <span class="header-icon-stack" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>
    
    <!-- Mobile overlay menu -->
    <div class="mobile-menu-overlay">
      <ul></ul>
    </div>
  </header>

  <!-- FILTER MODAL (hidden by default) -->
  <div class="filter-overlay" role="dialog" aria-modal="true" aria-labelledby="filter-title">
    <div class="filter-panel">
      <h2 id="filter-title">Filter Products</h2>
      <button class="filter-close material-icons" id="filter-close" aria-label="Close Filters">close</button>
      <div class="filter-section" id="type-section">
        <strong>Type <span class="filter-section-count" data-section="type" data-count="0">0 selected</span></strong>
        <div class="chip-group" id="type-chips"></div>
      </div>
      <div class="filter-section" id="price-section">
        <strong>Price <span class="filter-section-count" data-section="price" data-count="0">0 selected</span></strong>
        <div class="chip-group" id="price-chips"></div>
      </div>
      <div class="filter-section" id="tags-section">
        <strong>Tags <span class="filter-section-count" data-section="tag" data-count="0">0 selected</span></strong>
        <div class="chip-group" id="tag-chips"></div>
      </div>
      <div class="filter-section" id="votes-section">
        <div class="slider-label">
          <label for="votes-slider">Min Votes</label>
          <span id="votes-value">0</span>
        </div>
        <input type="range" id="votes-slider" min="0" max="25" value="0" />
      </div>
      <div class="filter-actions">
        <button id="filter-reset" type="button">Reset</button>
        <button id="filter-apply" type="button">Show all products</button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT: Product carousel -->
  <main id="main" tabindex="-1">
    <!-- Filter results are announced here. The grid itself is rebuilt wholesale
         on every filter, so it must not be a live region. -->
    <p id="carousel-status" class="visually-hidden" role="status"></p>
    <section id="carousel" class="carousel">
      <!-- Skeleton loading cards (replaced when products load) -->
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
    </section>
  </main>

  <!-- IMAGE MODAL -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Product image gallery">
    <div class="modal-content">
      <button id="close-modal-button" class="modal-close material-icons" aria-label="Close">close</button>
      <button class="modal-nav modal-nav-left material-icons" aria-label="Previous">chevron_left</button>
      <button class="modal-nav modal-nav-right material-icons" aria-label="Next">chevron_right</button>
      <div id="modal-image-container" class="modal-image-container"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer is-light">
    <nav aria-label="Footer">
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS -->
  <script src="js/storeAccess.js"></script>
  <script src="js/secretStore.js"></script>
  <script src="js/header.js"></script>
  <script type="module" src="js/cartManager.js"></script>
  <script type="module" src="js/sustainabilityAlert.js"></script>
  <script type="module" src="js/kaayko_apiClient.js"></script>
  <script type="module" src="js/kaayko-main.js"></script>
  <script src="js/kaaykoFilterModal.js"></script>
  <script type="module" src="js/kaayko_ui.js"></script>

  <!-- Initialize Cart Manager -->
  <script type="module">
    import { cartManager } from './js/cartManager.js';
    import './js/sustainabilityAlert.js';
    
    // Make cart manager globally available
    window.cartManager = cartManager;
    
    // Add cart icon to header (store only)
    const headerControls = document.querySelector('.header-controls');
    if (headerControls) {
      const cartBtn = document.createElement('a');
      cartBtn.href = 'cart';
      cartBtn.className = 'cart-nav-button';
      cartBtn.innerHTML = `
        <svg class="header-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="19" r="1.8"></circle>
          <circle cx="17" cy="19" r="1.8"></circle>
          <path d="M4 5h2l2.1 8.2a1 1 0 0 0 1 .8h7.9a1 1 0 0 0 1-.75L20 8H8"></path>
        </svg>
        <span class="cart-badge" aria-hidden="true">0</span>
      `;
      
      // Insert before filter button
      headerControls.insertBefore(cartBtn, headerControls.firstChild);
      
      // Update badge on cart changes
      const updateBadge = () => {
        const count = cartManager.getCount();
        const badge = cartBtn.querySelector('.cart-badge');
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
        // The link's accessible name is this label, never the badge digit (4.1.2).
        cartBtn.setAttribute('aria-label', `Bag, ${count} item${count === 1 ? '' : 's'}`);
      };
      
      cartManager.subscribe(updateBadge);
      updateBadge(); // Initial
      
      // Also refresh all cart button states when cart changes
      cartManager.subscribe(() => {
        // Update all cart buttons on the page
        document.querySelectorAll('.cart-button-container').forEach(container => {
          const productId = container.dataset.productId || container.querySelector('.cart-link')?.dataset.productId;
          const isInCart = cartManager.hasProduct(productId);
          const link = container.querySelector('.cart-link');
          const label = container.querySelector('.cart-label');
          const icon = container.querySelector('.cart-link-icon');
          
          if (isInCart) {
            container.classList.add('in-cart');
            if (link) link.classList.add('in-cart');
            if (label) label.textContent = 'In bag';
            if (icon) icon.style.display = 'inline-flex';
          } else {
            container.classList.remove('in-cart');
            if (link) link.classList.remove('in-cart');
            if (label) label.textContent = 'Add to bag';
            if (icon) icon.style.display = 'none';
          }
        });
      });
    }
    
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script>
    /* kaayko-footer-year */
    (function () {
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>

</body>

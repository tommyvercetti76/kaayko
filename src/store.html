<html lang="en" prefix="og: http://ogp.me/ns# product: http://ogp.me/ns/product#">
<head>
  <script src="/js/prod-config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Primary Meta Tags -->
  <title>Kaayko Store · Printed to order</title>
  <meta name="title" content="Kaayko Store - Unique Outdoor & Paddling Apparel">
  <meta name="description" content="Indian wildlife totes and magnets, stamp-series bottles and satirical shirts, printed to order. Two things to a bag, guest checkout, no tricks." />
  <meta name="author" content="Kaayko">
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://kaayko.com/store" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kaayko.com/store">
  <meta property="og:title" content="Kaayko Store">
  <meta property="og:description" content="Printed to order. Indian wildlife, stamp-series bottles, satirical shirts. Two things to a bag, no tricks.">
  <meta property="og:image" content="https://kaayko.com/assets/store-og.png">
  <meta property="og:site_name" content="Kaayko">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://kaayko.com/store">
  <meta name="twitter:title" content="Kaayko Store">
  <meta name="twitter:description" content="Printed to order. Indian wildlife, stamp-series bottles, satirical shirts. Two things to a bag, no tricks.">
  <meta name="twitter:image" content="https://kaayko.com/assets/store-og.png">
  
  <!-- Schema.org Store -->
  <script type="application/ld+json">

    "@context": "https://schema.org",

  <!-- Smart App Banner -->
  
  <!-- Security & Performance -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="theme-color" content="#d4af37">
  
  <!-- 1) Global Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/storestyle.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/fitPicker.css" />
  <link rel="stylesheet" href="/css/storeAccess.css" />

  <!-- 2) Header + Filter Toggle Styles -->
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/kaaykoFilterModal.css" />
  <link rel="stylesheet" href="/css/secretStore.css" />

  <!-- 3) Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  
  <!-- 4) Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="/css/footer.css">
  <!-- Store-only domain (kaay.store): hide the shop until the invite code is
       accepted. Runs synchronously in <head> so the catalogue never flashes
       before the gate appears. secretStore.js opens the prompt and clears
       .store-locked on success. -->
  <style>
    html.store-locked body > .skip-link,
    html.store-locked body > header,
    html.store-locked body > main,
    html.store-locked body > footer { visibility: hidden; }
  </style>
  <script>
    (function () {
      var STORE_DOMAINS = ['kaay.store', 'www.kaay.store',
                           'kaay-store.web.app', 'kaay-store.firebaseapp.com'];
      if (STORE_DOMAINS.indexOf(location.hostname) === -1) return;
      var p = location.pathname;
      if (p !== '/' && p !== '/index.html') return;
      var params = new URLSearchParams(location.search);
      if (params.get('bypass') === 'kortex' && params.has('ref')) return;
      try {
        if (localStorage.getItem('kaaykoStoreAccess') === 'granted') return;
      } catch (e) { /* private mode — fall through and lock */ }
      document.documentElement.classList.add('store-locked');
    })();
  </script>
  <link rel="stylesheet" href="/css/pdp-motion.css" />
  <script src="/js/pdp-motion.js"></script>
</head>

<body class="store-v2">
  <a class="skip-link" href="#main">Skip to products</a>
  <!-- HEADER (shared across all pages) -->
  <header class="header">
    <div class="header-top">
      <!-- Brand -->
      <div class="header-brand">
        <h1 class="header-title">Kaayko</h1>
        <p class="header-subtitle">Style Your Soul</p>
      </div>
      <!-- Desktop navigation -->
      <nav class="top-menu"><ul></ul></nav>
      <!-- Controls: Filter | Dark-mode | Mobile menu -->
      <div class="header-controls">
        <!-- Filter Toggle -->
        <button id="filter-toggle" aria-label="Open filters">
          <svg class="header-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M7 12h10" />
            <path d="M10 17h4" />
          </svg>
        </button>
        <!-- Universal Theme Toggle -->
        <button class="theme-toggle-icon" aria-label="Switch theme"></button>
        <!-- Mobile FAB -->
        <button class="fab-menu mobile-only" aria-label="Open menu">
          <span class="header-icon-stack" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>
    </div>
    
    <!-- Mobile overlay menu -->
    <div class="mobile-menu-overlay">
      <ul></ul>
    </div>
  </header>

  <!-- REFINE (hidden by default). Type, search and sort live in the toolbar above
       the grid; this dialog narrows within them by theme and tag. -->
  <div class="filter-overlay" role="dialog" aria-modal="true" aria-labelledby="filter-title">
    <div class="filter-panel">
      <h2 id="filter-title">Refine</h2>
      <button class="filter-close material-icons" id="filter-close" aria-label="Close">close</button>
      <div class="filter-section" id="theme-section" hidden>
        <strong>Theme <span class="filter-section-count" data-section="theme" data-count="0">0 selected</span></strong>
        <div class="chip-group" id="theme-chips"></div>
      </div>
      <div class="filter-section" id="tags-section">
        <strong>Tags <span class="filter-section-count" data-section="tag" data-count="0">0 selected</span></strong>
        <div class="chip-group" id="tag-chips"></div>
      </div>
      <p class="filter-note">Pick a type, search or sort above the grid. This narrows within that.</p>
      <div class="filter-actions">
        <button id="filter-reset" type="button">Reset</button>
        <button id="filter-apply" type="button">Show all products</button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT: Product carousel -->
  <main id="main" tabindex="-1">
    <!-- Filter results are announced here. The grid itself is rebuilt wholesale
         on every filter, so it must not be a live region. -->
    <p id="carousel-status" class="visually-hidden" role="status"></p>
    <section id="carousel" class="carousel">
      <!-- Skeleton loading cards (replaced when products load) -->
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
      <div class="carousel-item skeleton-card"><div class="skeleton-image"></div><div class="skeleton-text skeleton-title"></div><div class="skeleton-text skeleton-desc"></div><div class="skeleton-text skeleton-desc" style="width:80%"></div><div class="skeleton-text skeleton-price"></div></div>
    </section>
  </main>

  <!-- IMAGE MODAL -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Product image gallery">
    <div class="modal-content">
      <button id="close-modal-button" class="modal-close material-icons" aria-label="Close">close</button>
      <button class="modal-nav modal-nav-left material-icons" aria-label="Previous">chevron_left</button>
      <button class="modal-nav modal-nav-right material-icons" aria-label="Next">chevron_right</button>
      <div id="modal-image-container" class="modal-image-container"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer is-light">
    <nav aria-label="Footer">
      <a href="/store/about">About</a>
      <a href="/store/privacy">Privacy</a>
      <a href="/legal/terms">Terms</a>
      <a href="/legal/returns">Returns</a>
      <a href="/legal/shipping">Shipping</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <!-- SCRIPTS: three classic scripts (gate, invite modal, header) and one page module.
       Everything the grid needs is imported by js/pages/store.js. -->
  <script src="/js/storeAccess.js"></script>
  <script src="/js/secretStore.js"></script>
  <script src="/js/header.js"></script>
  <script type="module" src="/js/pages/store.js"></script>

</body>
</html>

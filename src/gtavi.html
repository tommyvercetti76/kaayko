<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>GTA VI · four days · we finish it</title>
  <meta name="description" content="GTA VI launch party in Texas. Four days, come and go. Are you in?">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GTA VI. Four days. We finish it.">
  <meta property="og:description" content="Nov 19–22 · McKinney, Texas · come and go. Are you in?">
  <meta property="og:image" content="https://kaayko.com/assets/gtavi/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://kaayko.com/gtavi">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#07060f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
  <link rel="stylesheet" href="css/gtavi.css">
</head>
<body>

<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zm7 0h4v15h-4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zm13 0v14L9.5 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5l9.5 7L5 19z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zm11.5-1.2a4.5 4.5 0 0 1 0 7.4v-1.9a2.6 2.6 0 0 0 0-3.6zm0-4.1a8.3 8.3 0 0 1 0 15.6v-2a6.4 6.4 0 0 0 0-11.6z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zm11 .4 1.4-1.4L18.5 10.6l2.1-2.1L22 9.9 19.9 12l2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4zm12.6 0L6.4 19 5 17.6 17.6 5z"/></symbol>
</svg>

<header class="hero">
  <img class="hero__bg" src="assets/gtavi/vice_city_15.webp" alt="" fetchpriority="high">
  <div class="hero__copy">
    <p class="label">November 19 – 22 · McKinney, Texas</p>
    <h1>GTA VI.<br>Four days.<br>We finish it.</h1>
    <p class="hero__line">Come and go. Day or night.</p>
    <form id="rsvp-form" class="rsvp" autocomplete="name" novalidate>
      <label class="label" for="rsvp-name">Who's coming</label>
      <input id="rsvp-name" class="rsvp__name" name="name" type="text" maxlength="40" placeholder="Name" required>
      <div class="rsvp__acts">
        <button type="submit" class="btn" id="rsvp-in">I'm in</button>
        <button type="button" class="btn btn--ghost" id="rsvp-out">Can't make it</button>
      </div>
      <div class="rsvp__reply" id="rsvp-msg" role="status" aria-live="polite" hidden></div>
    </form>
  </div>
</header>

<main>
  <section class="radio" id="radio">
    <div class="sec-head">
      <h2>Vice City Radio</h2>
      <p class="label" id="radio-hint">Tap to tune in</p>
    </div>
    <div class="deck">
      <div class="deck__screen"><div id="radio-player"></div></div>
      <div class="deck__panel">
        <div class="deck__dial" id="radio-dial" role="tablist" aria-label="Stations"></div>
        <div class="deck__now">
          <p class="deck__station" id="radio-station">—</p>
          <p class="label" id="radio-dj"></p>
        </div>
        <div class="deck__ctl">
          <button type="button" class="ctl" id="radio-prev" aria-label="Previous station"><svg><use href="#i-prev"/></svg></button>
          <button type="button" class="ctl ctl--main" id="radio-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
          <button type="button" class="ctl" id="radio-next" aria-label="Next station"><svg><use href="#i-next"/></svg></button>
          <button type="button" class="ctl ctl--quiet" id="radio-mute" aria-label="Mute"><svg><use href="#i-vol"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <section class="media" id="media">
    <div class="sec-head">
      <h2>Watch</h2>
    </div>
    <div class="strip" id="strip">
      <button type="button" class="tile tile--film" data-yt="rz1B4B2yBZY"><img src="https://i.ytimg.com/vi/rz1B4B2yBZY/hqdefault.jpg" alt="" loading="lazy"><span class="tile__cap">Launch trailer</span></button>
      <button type="button" class="tile tile--film" data-yt="tJbzMqJGH4k"><img src="https://i.ytimg.com/vi/tJbzMqJGH4k/hqdefault.jpg" alt="" loading="lazy"><span class="tile__cap">An extended look · 26 min</span></button>
      <button type="button" class="tile tile--film" data-yt="VQRLujxTm3c"><img src="https://i.ytimg.com/vi/VQRLujxTm3c/hqdefault.jpg" alt="" loading="lazy"><span class="tile__cap">Trailer 2</span></button>
      <button type="button" class="tile tile--film" data-yt="QdBZY2fkU-0"><img src="https://i.ytimg.com/vi/QdBZY2fkU-0/hqdefault.jpg" alt="" loading="lazy"><span class="tile__cap">Trailer 1</span></button>
      <button type="button" class="tile"><img src="assets/gtavi/vice_city_13.webp" alt="Vice City at night" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/jason_and_lucia_15.webp" alt="Jason and Lucia" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/lucia_caminos_11.webp" alt="Lucia Caminos" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/jason_duval_11.webp" alt="Jason Duval" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/port_gellhorn_07.webp" alt="Port Gellhorn" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/vice_city_20.webp" alt="Vice City beach" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/leonida_keys_07.webp" alt="Leonida Keys" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/grassrivers_07.webp" alt="Grassrivers" loading="lazy"></button>
      <button type="button" class="tile"><img src="assets/gtavi/vice_city_24.webp" alt="Vice City skyline" loading="lazy"></button>
    </div>
  </section>
</main>

<footer class="foot">
  <p>Private party. Game footage © Rockstar Games. Radio via YouTube.</p>
  <p>kaay.link/gtavi</p>
</footer>

<div class="bar" id="bar" hidden>
  <button type="button" class="ctl ctl--main" id="bar-play" aria-label="Play"><svg><use href="#i-play"/></svg></button>
  <a class="bar__text" href="#radio"><span class="bar__dot" aria-hidden="true"></span><span id="bar-station">—</span></a>
  <button type="button" class="ctl" id="bar-next" aria-label="Next station"><svg><use href="#i-next"/></svg></button>
</div>

<dialog class="lightbox" id="lightbox">
  <button type="button" class="ctl lightbox__close" id="lightbox-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <img id="lightbox-img" alt="">
</dialog>

<script type="module" src="js/gtavi.js"></script>
</body>
</html>

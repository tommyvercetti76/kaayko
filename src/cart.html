<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/prod-config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Your Bag — Kaayko</title>
  <meta name="title" content="Your Bag — Kaayko">
  <meta name="description" content="Review your Kaayko selection and check out securely.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Security - X-Frame-Options set via Firebase hosting headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="theme-color" content="#f5f1e7">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/storestyle.css" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/footer.css" />

  <style>
    /* ────────────────────────────────────────────────────────────────
       Checkout — namespaced `co-`.
       Colours come entirely from the store-v2 token set defined in
       storestyle.css, so this page follows the store's light/dark
       theme instead of re-declaring its own palette.
       ──────────────────────────────────────────────────────────────── */

    /* ── Escape the shared full-height flex trap ───────────────────────
       storestyle.css sets `html, body { height: 100% }` with
       `body { display:flex }` and `main { flex: 1 }`. That pins <main> to
       exactly the viewport, so a checkout taller than the screen overflows
       its own box and paints straight over the footer — and the document
       reports nothing to scroll. Scoped to the checkout pages so the store
       grid keeps the behaviour it was built against. */
    html, body.co-root {
      height: auto;
      min-height: 100vh;
    }
    body.co-root {
      display: flex;
      flex-direction: column;
      /* storestyle.css sets `html, body { overflow-x: hidden }`. On <html>
         that propagates to the viewport, which is what we want. On <body> it
         makes BODY its own scroll container, so the viewport has nothing to
         scroll and window.scrollTo() does nothing. Hand scrolling back. */
      overflow: visible;
    }
    body.co-root .co-wrapper { flex: 1 0 auto; }
    body.co-root .site-footer { flex: 0 0 auto; }

    /* ── Black & gold identity ─────────────────────────────────────────
       Checkout commits to one look rather than following the store's
       light/dark toggle: a focused, quiet room to pay in. Values are the
       Paddling Out palette (css/forecast.css) so the two products read as
       one house. Redefining the --v2-* tokens here re-skins every rule
       below in one place instead of scattering colours through the file. */
    /* Day is the store's beige/ivory. Night is black and gold, using the
       Paddling Out palette (css/forecast.css) so the two products read as
       one house. The theme toggle in the topbar drives both. */
    body.co-root.store-v2 {
      --co-danger:  #a83826;
      --co-ease:    cubic-bezier(0.76, 0, 0.24, 1);
      --co-btn-bg:  var(--v2-fg);
      --co-btn-fg:  var(--v2-bg);
      --co-btn-glow: rgba(26, 24, 21, 0.20);
      /* 45% of the foreground over the ground lands ≈3.3:1 in both themes —
         the field border is its only visual boundary, so 1.4.11 applies. */
      --co-input-border: color-mix(in srgb, var(--v2-fg) 45%, transparent);
    }

    html.dark-theme body.co-root.store-v2 {
      --v2-bg:           #080808;
      --v2-surface:      #18160f;   /* warm dark card, visible on #080808 */
      --v2-surface-elev: #1e1c12;
      --v2-border:       rgba(181, 147, 90, 0.20);
      --v2-fg:           #ede8df;
      --v2-fg-muted:     rgba(237, 232, 223, 0.62);
      --v2-gold:         #b5935a;
      --v2-gold-bright:  #d9bd7b;
      --v2-image-bg:     #14120c;
      --v2-image-border: rgba(181, 147, 90, 0.18);
      --co-danger:       #d9614e;   /* lifted for contrast on near-black */
      --co-btn-bg:       linear-gradient(180deg, var(--v2-gold-bright), var(--v2-gold));
      --co-btn-fg:       #17130a;
      --co-btn-glow:     rgba(181, 147, 90, 0.26);
    }

    /* storestyle.css paints body.store-v2 with its own radial wash; restate
       it here so the night palette gets a matching one instead of cream. */
    html.dark-theme body.co-root.store-v2 {
      background:
        radial-gradient(circle at 20% 12%, rgba(181, 147, 90, 0.10), transparent 38%),
        radial-gradient(circle at 80% 84%, rgba(181, 147, 90, 0.07), transparent 44%),
        var(--v2-bg);
      color: var(--v2-fg);
    }

    .store-v2 {
      --co-serif: 'Cormorant Garamond', Georgia, serif;
      --co-sans: 'Josefin_Light', 'Josefin Sans', Arial, sans-serif;
      --co-sans-med: 'Josefin_Medium', 'Josefin Sans', Arial, sans-serif;
      --co-radius: 14px;
      --co-gap: clamp(20px, 3vw, 36px);
    }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .co-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      height: 60px;
      padding: 0 clamp(16px, 4vw, 32px);
      background: color-mix(in srgb, var(--v2-bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--v2-border);
    }

    .co-topbar-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      margin-left: -6px;
      border-radius: 50%;
      color: var(--v2-fg);
      text-decoration: none;
      transition: background 0.18s ease;
    }
    .co-topbar-back:hover { background: color-mix(in srgb, var(--v2-fg) 8%, transparent); }

    .co-topbar-title {
      font-family: var(--co-serif);
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--v2-gold);
    }

    .co-topbar-actions { display: inline-flex; align-items: center; gap: 10px; }

    .co-topbar-brand {
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--v2-fg);
      text-decoration: none;
    }

    /* ── Layout ────────────────────────────────────────────────────── */
    .co-wrapper {
      padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 32px) clamp(32px, 5vw, 64px);
      box-sizing: border-box;
    }

    .co-page { max-width: 1180px; margin: 0 auto; }

    .co-masthead { margin-bottom: clamp(24px, 4vw, 40px); }

    .co-masthead h1 {
      margin: 0;
      font-family: var(--co-serif);
      font-weight: 500;
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.04;
      letter-spacing: -0.01em;
      color: var(--v2-fg);
    }

    .co-masthead p {
      margin: 10px 0 0;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }

    .co-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr);
      gap: var(--co-gap);
      align-items: start;
    }

    /* ── Section label (house style: gold serif small caps) ────────── */
    .co-label {
      display: block;
      margin: 0 0 14px;
      font-family: var(--co-serif);
      font-style: italic;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--v2-gold);
    }

    /* ── Bag items ─────────────────────────────────────────────────── */
    .co-bag { min-width: 0; }

    .co-item {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding: 20px 0;
      border-bottom: 1px solid var(--v2-border);
    }
    .co-item:first-of-type { border-top: 1px solid var(--v2-border); }

    .co-item-image {
      width: 92px;
      aspect-ratio: 4 / 5;
      border-radius: 10px;
      object-fit: cover;
      background: var(--v2-image-bg);
      border: 1px solid var(--v2-image-border);
    }
    /* A missing image should leave a quiet tile, not overflowing alt
       text. The alt attribute is untouched, so screen readers still
       announce it. */
    .co-item-image.is-broken { font-size: 0; color: transparent; }

    .co-item-body { min-width: 0; }

    .co-item-title {
      margin: 0 0 6px;
      font-family: var(--co-serif);
      font-weight: 600;
      font-size: 20px;
      line-height: 1.2;
      color: var(--v2-fg);
    }

    .co-item-meta {
      margin: 0;
      font-family: var(--co-sans);
      font-size: 13px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }

    .co-item-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      white-space: nowrap;
    }

    .co-item-price {
      font-family: var(--co-sans-med);
      font-size: 16px;
      color: var(--v2-fg);
      font-variant-numeric: tabular-nums;
    }

    .co-item-remove {
      background: none;
      border: none;
      padding: 4px 0;
      font-family: var(--co-sans);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--v2-fg-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.18s ease;
    }
    .co-item-remove:hover { color: var(--v2-fg); }

    .co-bag-note {
      margin: 18px 0 0;
      font-family: var(--co-sans);
      font-size: 12px;
      color: var(--v2-fg-muted);
    }

    /* ── Summary card ──────────────────────────────────────────────── */
    .co-aside { position: sticky; top: 84px; min-width: 0; }

    .co-card {
      padding: clamp(20px, 2.4vw, 28px);
      border: 1px solid var(--v2-border);
      border-radius: var(--co-radius);
      background: var(--v2-surface);
    }

    .co-money { font-variant-numeric: tabular-nums; }

    .co-money-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 7px 0;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }

    .co-money-row.is-total {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--v2-border);
      font-family: var(--co-sans-med);
      font-size: 19px;
      color: var(--v2-fg);
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .co-btn {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--co-btn-bg);
      color: var(--co-btn-fg);
      font-family: var(--co-sans-med);
      font-size: 14px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 0.2s var(--co-ease), transform 0.2s var(--co-ease),
                  box-shadow 0.2s var(--co-ease);
    }
    .co-btn:hover:not(:disabled) {
      filter: brightness(1.07);
      box-shadow: 0 6px 22px var(--co-btn-glow);
    }
    .co-btn:active:not(:disabled) { transform: translateY(1px); }
    .co-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .co-btn:focus-visible { outline: 2px solid var(--v2-gold); outline-offset: 3px; }

    .co-reassure {
      margin: 14px 0 0;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }

    /* ── Checkout step (revealed after "Continue") ─────────────────── */
    .co-step { display: none; }
    .co-step.is-open { display: block; }

    .co-fieldset { margin-bottom: 18px; }

    .co-field { margin-bottom: 14px; }

    .co-field-label {
      display: block;
      margin-bottom: 7px;
      font-family: var(--co-sans-med);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--v2-fg);
    }
    .co-req { color: var(--v2-gold); }
    .co-opt { color: var(--v2-fg-muted); font-family: var(--co-sans); }

    .co-input {
      width: 100%;
      box-sizing: border-box;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--co-input-border);
      border-radius: 10px;
      background: var(--v2-surface-elev);
      color: var(--v2-fg);
      font-family: var(--co-sans);
      font-size: 14px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .co-input::placeholder { color: var(--v2-fg-muted); }   /* ≥4.5:1 in both themes */
    .co-input:focus {
      outline: none;
      border-color: var(--v2-gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--v2-gold) 18%, transparent);
    }
    .co-input.is-invalid { border-color: var(--co-danger); }

    .co-error {
      display: none;
      margin-top: 6px;
      font-family: var(--co-sans-med);
      font-size: 11.5px;
      color: var(--co-danger);
    }
    .co-error.is-shown { display: block; }

    .co-ready-hint {
      margin: 10px 0 0;
      min-height: 1.2em;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12.5px;
      color: var(--v2-fg-muted);
    }
    .co-legal {
      margin: 12px 0 0;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }
    .co-legal a { color: var(--v2-gold); text-underline-offset: 2px; }
    .co-money-row.is-pending span:last-child { color: var(--v2-fg-muted); font-style: italic; }


    .co-divider {
      height: 1px;
      margin: 22px 0;
      background: var(--v2-border);
      border: none;
    }

    /* ── Stripe element hosts ──────────────────────────────────────── */
    #co-address-element { margin-bottom: 20px; }

    .co-skeleton {
      display: grid;
      gap: 10px;
      padding: 4px 0;
    }
    .co-skeleton i {
      display: block;
      height: 44px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--v2-fg) 7%, transparent);
      animation: co-pulse 1.5s ease-in-out infinite;
    }
    .co-skeleton i:nth-child(2) { animation-delay: 0.18s; }
    .co-skeleton i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes co-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

    .co-loading-note {
      margin: 12px 0 0;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12px;
      color: var(--v2-fg-muted);
    }

    .co-failure {
      padding: 22px 18px;
      text-align: center;
      border: 1px solid var(--v2-border);
      border-radius: 10px;
      background: var(--v2-surface-elev);
    }
    .co-failure .material-icons { font-size: 34px; color: var(--co-danger); }
    .co-failure p {
      margin: 10px 0 16px;
      font-family: var(--co-sans);
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }
    .co-failure button {
      min-height: 42px;
      padding: 0 22px;
      border: 1px solid var(--v2-border);
      border-radius: 999px;
      background: none;
      color: var(--v2-fg);
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    /* ── Empty state ───────────────────────────────────────────────── */
    .co-empty {
      padding: clamp(48px, 10vw, 96px) 16px;
      text-align: center;
    }
    .co-empty h2 {
      margin: 0 0 10px;
      font-family: var(--co-serif);
      font-weight: 500;
      font-size: clamp(28px, 5vw, 40px);
      color: var(--v2-fg);
    }
    .co-empty p {
      margin: 0 0 26px;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }
    .co-empty a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 24px;
      border: 1px solid var(--v2-border);
      border-radius: 999px;
      color: var(--v2-fg);
      text-decoration: none;
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .co-empty a:hover { border-color: var(--v2-gold); color: var(--v2-gold); }

    /* ── Sticky mobile bar ─────────────────────────────────────────── */
    .co-sticky {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 110;
      display: none;
      padding: 12px clamp(16px, 4vw, 32px) calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--v2-bg) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--v2-border);
    }
    .co-sticky .co-btn { margin-top: 0; }
    /* The summary card already carries the primary action on wide
       screens; the sticky bar is the small-screen stand-in for it. */
    @media (max-width: 900px) {
      .co-sticky.is-active { display: block; }
    }

    /* ── Toast ─────────────────────────────────────────────────────── */
    .co-toast {
      position: fixed;
      left: 50%;
      top: 20px;
      z-index: 10000;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: min(92vw, 460px);
      padding: 14px 18px;
      border: 1px solid var(--v2-border);
      border-radius: 12px;
      background: var(--v2-surface-elev);
      color: var(--v2-fg);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      font-family: var(--co-sans);
      font-size: 13.5px;
      line-height: 1.55;
      animation: co-toast-in 0.32s var(--co-ease) both;
    }
    .co-toast .material-icons { font-size: 19px; flex: none; margin-top: 1px; }
    .co-toast.is-error { border-color: color-mix(in srgb, var(--co-danger) 55%, transparent); }
    .co-toast.is-error .material-icons { color: var(--co-danger); }
    .co-toast.is-notice .material-icons { color: var(--v2-gold); }
    .co-toast.is-leaving { animation: co-toast-out 0.24s var(--co-ease) both; }

    @keyframes co-toast-in {
      from { opacity: 0; transform: translate(-50%, -14px) scale(0.98); }
      to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    @keyframes co-toast-out {
      from { opacity: 1; transform: translate(-50%, 0); }
      to   { opacity: 0; transform: translate(-50%, -10px); }
    }

    /* ── Motion ────────────────────────────────────────────────────────
       Restrained on purpose: entrances only, nothing that delays input. */
    .co-item {
      animation: co-rise 0.42s var(--co-ease) both;
      animation-delay: calc(var(--co-i, 0) * 70ms);
    }
    .co-masthead { animation: co-rise 0.4s var(--co-ease) both; }
    .co-aside    { animation: co-rise 0.46s var(--co-ease) 0.06s both; }
    .co-step.is-open { animation: co-reveal 0.44s var(--co-ease) both; }

    @keyframes co-rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes co-reveal {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: none; }
    }

    .co-item-remove,
    .co-empty a { transition: color 0.2s var(--co-ease), border-color 0.2s var(--co-ease); }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .co-layout { grid-template-columns: minmax(0, 1fr); }
      .co-aside { position: static; }
      /* The sticky bar is fixed to the viewport, so clearance has to sit on
         the LAST element in flow. Padding on .co-wrapper alone left the
         footer — its sibling — underneath the bar. */
      .co-wrapper { padding-bottom: 32px; }
      body.co-root .site-footer {
        padding-bottom: calc(2.5rem + 118px + env(safe-area-inset-bottom));
      }
      /* The sticky bar is the primary action here — don't show it twice. */
      .co-card > #co-primary,
      .co-card > .co-reassure { display: none; }
    }

    @media (max-width: 480px) {
      .co-item { grid-template-columns: 72px minmax(0, 1fr); gap: 14px; }
      .co-item-image { width: 72px; }
      .co-item-side {
        grid-column: 2;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .co-skeleton i,
      .co-item, .co-masthead, .co-aside, .co-step.is-open, .co-toast {
        animation: none;
      }
      .co-btn, .co-input, .co-topbar-back, .co-item-remove, .co-empty a {
        transition: none;
      }
    }
  </style>
</head>

<body class="store-v2 co-root">
  <header class="co-topbar">
    <a href="store" class="co-topbar-back" aria-label="Back to store"><span class="material-icons">arrow_back</span></a>
    <div class="co-topbar-title">Bag <span id="co-count">0</span></div>
    <div class="co-topbar-actions">
      <button class="theme-toggle-icon" aria-label="Switch theme"></button>
      <a href="/" class="co-topbar-brand">Kaayko</a>
    </div>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/prod-config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Your Bag — Kaayko</title>
  <meta name="title" content="Your Bag — Kaayko">
  <meta name="description" content="Review your Kaayko selection and check out securely.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Security - X-Frame-Options set via Firebase hosting headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/png" href="/favicon-32x32.png">
  <meta name="theme-color" content="#f5f1e7">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/storestyle.css" />
  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/footer.css" />

  <style>
    /* ────────────────────────────────────────────────────────────────
       Checkout — namespaced `co-`.
       Colours come entirely from the store-v2 token set defined in
       storestyle.css, so this page follows the store's light/dark
       theme instead of re-declaring its own palette.
       ──────────────────────────────────────────────────────────────── */

    .store-v2 {
      --co-serif: 'Cormorant Garamond', Georgia, serif;
      --co-sans: 'Josefin_Light', 'Josefin Sans', Arial, sans-serif;
      --co-sans-med: 'Josefin_Medium', 'Josefin Sans', Arial, sans-serif;
      --co-radius: 14px;
      --co-gap: clamp(20px, 3vw, 36px);
    }

    /* ── Top bar ───────────────────────────────────────────────────── */
    .co-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      height: 60px;
      padding: 0 clamp(16px, 4vw, 32px);
      background: color-mix(in srgb, var(--v2-bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--v2-border);
    }

    .co-topbar-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      margin-left: -6px;
      border-radius: 50%;
      color: var(--v2-fg);
      text-decoration: none;
      transition: background 0.18s ease;
    }
    .co-topbar-back:hover { background: color-mix(in srgb, var(--v2-fg) 8%, transparent); }

    .co-topbar-title {
      font-family: var(--co-serif);
      font-style: italic;
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--v2-gold);
    }

    .co-topbar-actions { display: inline-flex; align-items: center; gap: 10px; }

    .co-topbar-brand {
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--v2-fg);
      text-decoration: none;
    }

    /* ── Layout ────────────────────────────────────────────────────── */
    .co-wrapper {
      min-height: calc(100vh - 60px);
      padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 32px) 140px;
      box-sizing: border-box;
    }

    .co-page { max-width: 1180px; margin: 0 auto; }

    .co-masthead { margin-bottom: clamp(24px, 4vw, 40px); }

    .co-masthead h1 {
      margin: 0;
      font-family: var(--co-serif);
      font-weight: 500;
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.04;
      letter-spacing: -0.01em;
      color: var(--v2-fg);
    }

    .co-masthead p {
      margin: 10px 0 0;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }

    .co-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.85fr);
      gap: var(--co-gap);
      align-items: start;
    }

    /* ── Section label (house style: gold serif small caps) ────────── */
    .co-label {
      display: block;
      margin: 0 0 14px;
      font-family: var(--co-serif);
      font-style: italic;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--v2-gold);
    }

    /* ── Bag items ─────────────────────────────────────────────────── */
    .co-bag { min-width: 0; }

    .co-item {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding: 20px 0;
      border-bottom: 1px solid var(--v2-border);
    }
    .co-item:first-of-type { border-top: 1px solid var(--v2-border); }

    .co-item-image {
      width: 92px;
      aspect-ratio: 4 / 5;
      border-radius: 10px;
      object-fit: cover;
      background: var(--v2-image-bg);
      border: 1px solid var(--v2-image-border);
    }
    /* A missing image should leave a quiet tile, not overflowing alt
       text. The alt attribute is untouched, so screen readers still
       announce it. */
    .co-item-image.is-broken { font-size: 0; color: transparent; }

    .co-item-body { min-width: 0; }

    .co-item-title {
      margin: 0 0 6px;
      font-family: var(--co-serif);
      font-weight: 600;
      font-size: 20px;
      line-height: 1.2;
      color: var(--v2-fg);
    }

    .co-item-meta {
      margin: 0;
      font-family: var(--co-sans);
      font-size: 13px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }

    .co-item-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      white-space: nowrap;
    }

    .co-item-price {
      font-family: var(--co-sans-med);
      font-size: 16px;
      color: var(--v2-fg);
      font-variant-numeric: tabular-nums;
    }

    .co-item-remove {
      background: none;
      border: none;
      padding: 4px 0;
      font-family: var(--co-sans);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--v2-fg-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 0.18s ease;
    }
    .co-item-remove:hover { color: var(--v2-fg); }

    .co-bag-note {
      margin: 18px 0 0;
      font-family: var(--co-sans);
      font-size: 12px;
      color: var(--v2-fg-muted);
    }

    /* ── Summary card ──────────────────────────────────────────────── */
    .co-aside { position: sticky; top: 84px; min-width: 0; }

    .co-card {
      padding: clamp(20px, 2.4vw, 28px);
      border: 1px solid var(--v2-border);
      border-radius: var(--co-radius);
      background: var(--v2-surface);
    }

    .co-money { font-variant-numeric: tabular-nums; }

    .co-money-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 7px 0;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }

    .co-money-row.is-total {
      margin-top: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--v2-border);
      font-family: var(--co-sans-med);
      font-size: 19px;
      color: var(--v2-fg);
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .co-btn {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--v2-fg);
      color: var(--v2-bg);
      font-family: var(--co-sans-med);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .co-btn:hover:not(:disabled) { opacity: 0.88; }
    .co-btn:active:not(:disabled) { transform: translateY(1px); }
    .co-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .co-btn:focus-visible { outline: 2px solid var(--v2-gold); outline-offset: 3px; }

    .co-reassure {
      margin: 14px 0 0;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }

    /* ── Checkout step (revealed after "Continue") ─────────────────── */
    .co-step { display: none; }
    .co-step.is-open { display: block; }

    .co-fieldset { margin-bottom: 18px; }

    .co-field { margin-bottom: 14px; }

    .co-field-label {
      display: block;
      margin-bottom: 7px;
      font-family: var(--co-sans-med);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--v2-fg);
    }
    .co-req { color: var(--v2-gold); }
    .co-opt { color: var(--v2-fg-muted); font-family: var(--co-sans); }

    .co-input {
      width: 100%;
      box-sizing: border-box;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--v2-border);
      border-radius: 10px;
      background: var(--v2-surface-elev);
      color: var(--v2-fg);
      font-family: var(--co-sans);
      font-size: 14px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .co-input::placeholder { color: color-mix(in srgb, var(--v2-fg-muted) 70%, transparent); }
    .co-input:focus {
      outline: none;
      border-color: var(--v2-gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--v2-gold) 18%, transparent);
    }
    .co-input.is-invalid { border-color: #c0492f; }

    .co-error {
      display: none;
      margin-top: 6px;
      font-family: var(--co-sans-med);
      font-size: 11.5px;
      color: #c0492f;
    }
    .co-error.is-shown { display: block; }

    .co-consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      padding: 12px 14px;
      border: 1px solid var(--v2-border);
      border-radius: 10px;
      background: var(--v2-surface-elev);
      cursor: pointer;
    }
    .co-consent input { margin-top: 2px; accent-color: var(--v2-gold); flex: none; }
    .co-consent span {
      font-family: var(--co-sans);
      font-size: 12px;
      line-height: 1.55;
      color: var(--v2-fg-muted);
    }
    .co-consent a { color: var(--v2-gold); text-decoration: underline; text-underline-offset: 2px; }

    .co-divider {
      height: 1px;
      margin: 22px 0;
      background: var(--v2-border);
      border: none;
    }

    /* ── Stripe element hosts ──────────────────────────────────────── */
    #co-address-element { margin-bottom: 20px; }

    .co-skeleton {
      display: grid;
      gap: 10px;
      padding: 4px 0;
    }
    .co-skeleton i {
      display: block;
      height: 44px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--v2-fg) 7%, transparent);
      animation: co-pulse 1.5s ease-in-out infinite;
    }
    .co-skeleton i:nth-child(2) { animation-delay: 0.18s; }
    .co-skeleton i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes co-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

    .co-loading-note {
      margin: 12px 0 0;
      text-align: center;
      font-family: var(--co-sans);
      font-size: 12px;
      color: var(--v2-fg-muted);
    }

    .co-failure {
      padding: 22px 18px;
      text-align: center;
      border: 1px solid var(--v2-border);
      border-radius: 10px;
      background: var(--v2-surface-elev);
    }
    .co-failure .material-icons { font-size: 34px; color: #c0492f; }
    .co-failure p {
      margin: 10px 0 16px;
      font-family: var(--co-sans);
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--v2-fg-muted);
    }
    .co-failure button {
      min-height: 42px;
      padding: 0 22px;
      border: 1px solid var(--v2-border);
      border-radius: 999px;
      background: none;
      color: var(--v2-fg);
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    /* ── Empty state ───────────────────────────────────────────────── */
    .co-empty {
      padding: clamp(48px, 10vw, 96px) 16px;
      text-align: center;
    }
    .co-empty h2 {
      margin: 0 0 10px;
      font-family: var(--co-serif);
      font-weight: 500;
      font-size: clamp(28px, 5vw, 40px);
      color: var(--v2-fg);
    }
    .co-empty p {
      margin: 0 0 26px;
      font-family: var(--co-sans);
      font-size: 14px;
      color: var(--v2-fg-muted);
    }
    .co-empty a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 24px;
      border: 1px solid var(--v2-border);
      border-radius: 999px;
      color: var(--v2-fg);
      text-decoration: none;
      font-family: var(--co-sans-med);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .co-empty a:hover { border-color: var(--v2-gold); color: var(--v2-gold); }

    /* ── Sticky mobile bar ─────────────────────────────────────────── */
    .co-sticky {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 110;
      display: none;
      padding: 12px clamp(16px, 4vw, 32px) calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--v2-bg) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--v2-border);
    }
    .co-sticky .co-btn { margin-top: 0; }
    /* The summary card already carries the primary action on wide
       screens; the sticky bar is the small-screen stand-in for it. */
    @media (max-width: 900px) {
      .co-sticky.is-active { display: block; }
    }

    /* ── Toast ─────────────────────────────────────────────────────── */
    .co-toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(92vw, 460px);
      padding: 14px 20px;
      border-radius: 10px;
      background: #2b1512;
      color: #ffeae6;
      box-shadow: 0 10px 34px rgba(0,0,0,0.32);
      font-family: var(--co-sans-med);
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* ── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .co-layout { grid-template-columns: minmax(0, 1fr); }
      .co-aside { position: static; }
      .co-wrapper { padding-bottom: 160px; }
      /* The sticky bar is the primary action here — don't show it twice. */
      .co-card > #co-primary,
      .co-card > .co-reassure { display: none; }
    }

    @media (max-width: 480px) {
      .co-item { grid-template-columns: 72px minmax(0, 1fr); gap: 14px; }
      .co-item-image { width: 72px; }
      .co-item-side {
        grid-column: 2;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .co-skeleton i { animation: none; }
      .co-btn, .co-input, .co-topbar-back, .co-item-remove { transition: none; }
    }
  </style>
</head>

<body class="store-v2">
  <header class="co-topbar">
    <a href="store" class="co-topbar-back" aria-label="Back to store"><span class="material-icons">arrow_back</span></a>
    <div class="co-topbar-title">Bag <span id="co-count">0</span></div>
    <div class="co-topbar-actions">
      <button class="theme-toggle-icon" aria-label="Switch theme"></button>
      <a href="/" class="co-topbar-brand">Kaayko</a>
    </div>
  </header>

  <main class="co-wrapper">
    <div class="co-page">
      <div id="co-content"></div>
    </div>
  </main>

  <div class="co-sticky" id="co-sticky">
    <button id="co-sticky-btn" class="co-btn">Continue · $0.00</button>
    <p class="co-reassure">Free shipping · 30-day returns</p>
  </div>

  <footer class="site-footer is-light">
    <nav aria-label="Footer">
      <a href="/store">Store</a>
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
    </nav>
    <p>&copy; <span id="year">2026</span> Kaayko. All rights reserved.</p>
  </footer>

  <script type="module" src="js/header.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script type="module">
    import { cartManager } from './js/cartManager.js';

    const STRIPE_KEY = window.KAAYKO_STRIPE_PK;
    const API_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:5001/kaaykostore/us-central1/api'
      : 'https://api-vwcc5j4qda-uc.a.run.app';

    /* ── Checkout state ──────────────────────────────────────────────
       The payment intent is created ONCE, when the shopper actively
       continues to checkout — not on every render. The old page called
       initPayment() from renderCart(), which was itself wired to a
       cart subscription and a debounced resize handler, so a stray
       window resize minted a fresh Stripe PaymentIntent and a
       Firestore document.                                             */
    const state = {
      step: 'bag',          // 'bag' | 'checkout'
      pi: null,             // { clientSecret, paymentIntentId, totals }
      elements: null,
      stripe: null,
      creating: false,
      cartSig: null,        // cart signature the current intent was priced for
      addressComplete: false,
      paymentComplete: false,
      emailValid: false
    };

    /* ── Helpers ─────────────────────────────────────────────────── */

    // Cart contents come from localStorage and product titles from
    // Firestore, so never interpolate them into HTML unescaped.
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const money = (n) => `$${Number(n || 0).toFixed(2)}`;

    const parsePrice = (p) => {
      const n = typeof p === 'number' ? p : parseFloat(String(p).replace(/[^0-9.]/g, ''));
      return Number.isFinite(n) ? n : 0;
    };

    // A stable fingerprint of what is in the bag. If this changes after
    // an intent exists, the intent was priced for a different bag.
    const signature = (items) => items
      .map(i => `${i.productId}|${i.size ?? ''}|${i.gender ?? ''}`)
      .sort()
      .join('~');

    // `gender` is deliberately null for totes, magnets and other
    // one-size goods (see js/animal.js) — the old page printed the
    // literal string "null" next to the size.
    const metaLine = (item) => {
      const parts = [];
      if (item.gender && item.gender !== 'null') parts.push(esc(item.gender));
      if (item.size) parts.push(`Size ${esc(item.size)}`);
      return parts.join(' · ');
    };

    const validEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

    function toast(message) {
      const el = document.createElement('div');
      el.className = 'co-toast';
      el.setAttribute('role', 'alert');
      el.innerHTML = `<span class="material-icons" style="font-size:19px">error_outline</span><span></span>`;
      el.lastElementChild.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    /* ── Totals ──────────────────────────────────────────────────────
       Once the server has priced the bag it is the authority: the API
       resolves every price from Firestore rather than trusting what the
       client sends. Until then we show the catalogue price the shopper
       already saw on the product page.                                */
    function totals(items) {
      const server = state.pi?.totals;
      if (server && typeof server.totalCents === 'number') {
        return {
          subtotal: (server.subtotalCents ?? server.totalCents) / 100,
          total: server.totalCents / 100,
          authoritative: true
        };
      }
      const subtotal = items.reduce((sum, i) => sum + parsePrice(i.price) * (i.quantity || 1), 0);
      return { subtotal, total: subtotal, authoritative: false };
    }

    /* ── Render ──────────────────────────────────────────────────── */

    function render() {
      const root = document.getElementById('co-content');
      const items = cartManager.getItems();
      const sticky = document.getElementById('co-sticky');

      document.getElementById('co-count').textContent = items.length;

      if (items.length === 0) {
        root.innerHTML = `
          <div class="co-empty">
            <h2>Your bag is empty</h2>
            <p>Nothing here yet. Have a look at what is in the shop.</p>
            <a href="store"><span class="material-icons" style="font-size:18px">arrow_back</span> Back to store</a>
          </div>`;
        sticky.classList.remove('is-active');
        state.step = 'bag';
        state.pi = null;
        return;
      }

      // The bag changed underneath an intent priced for a different
      // bag — drop back to review so a correctly priced one is made.
      if (state.pi && state.cartSig !== signature(items)) {
        state.pi = null;
        state.elements = null;
        state.step = 'bag';
      }

      const t = totals(items);

      root.innerHTML = `
        <div class="co-masthead">
          <h1>Your bag</h1>
          <p>${items.length} ${items.length === 1 ? 'piece' : 'pieces'}, chosen well.</p>
        </div>
        <div class="co-layout">
          <section class="co-bag">
            <span class="co-label">Items</span>
            ${items.map(itemMarkup).join('')}
            <p class="co-bag-note">A bag holds up to two pieces. Everything ships free, with 30 days to change your mind.</p>
          </section>

          <aside class="co-aside">
            <div class="co-card">
              <span class="co-label">Summary</span>
              <div class="co-money">
                <div class="co-money-row"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
                <div class="co-money-row"><span>Shipping</span><span>Free</span></div>
                <div class="co-money-row is-total"><span>Total</span><span>${money(t.total)}</span></div>
              </div>

              <div class="co-step ${state.step === 'checkout' ? 'is-open' : ''}" id="co-step">
                <hr class="co-divider" />
                <span class="co-label">Contact</span>
                <div class="co-fieldset">
                  <div class="co-field">
                    <label class="co-field-label" for="co-email">Email <span class="co-req">*</span></label>
                    <input class="co-input" type="email" id="co-email" autocomplete="email"
                           inputmode="email" placeholder="you@example.com" required />
                    <div class="co-error" id="co-email-error">Please enter a valid email</div>
                  </div>
                  <div class="co-field">
                    <label class="co-field-label" for="co-phone">Phone <span class="co-opt">(optional)</span></label>
                    <input class="co-input" type="tel" id="co-phone" autocomplete="tel"
                           placeholder="+1 (555) 123-4567" />
                  </div>
                </div>

                <label class="co-consent" for="co-consent">
                  <input type="checkbox" id="co-consent" checked />
                  <span>Save my shipping details so this order can be fulfilled. You can opt out at any time. <a href="/privacy">Privacy Policy</a></span>
                </label>

                <hr class="co-divider" />
                <span class="co-label">Shipping &amp; payment</span>
                <div id="co-address-element"></div>
                <div id="co-payment-element">
                  <div class="co-skeleton"><i></i><i></i><i></i></div>
                  <p class="co-loading-note">Preparing secure payment…</p>
                </div>
              </div>

              <button id="co-primary" class="co-btn">
                ${state.step === 'checkout' ? `Pay ${money(t.total)}` : `Continue · ${money(t.total)}`}
              </button>
              <p class="co-reassure">
                ${state.step === 'checkout'
                  ? 'Payments are handled by Stripe. Card details never touch Kaayko servers.'
                  : 'Free shipping · 30-day returns · Secure checkout by Stripe'}
              </p>
            </div>
          </aside>
        </div>`;

      root.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => cartManager.removeItem(btn.dataset.remove));
      });

      const primary = document.getElementById('co-primary');
      const stickyBtn = document.getElementById('co-sticky-btn');

      sticky.classList.add('is-active');
      stickyBtn.textContent = state.step === 'checkout' ? `Pay ${money(t.total)}` : `Continue · ${money(t.total)}`;

      if (state.step === 'bag') {
        primary.disabled = false;
        stickyBtn.disabled = false;
        primary.addEventListener('click', openCheckout);
        stickyBtn.onclick = openCheckout;
      } else {
        primary.disabled = true;
        stickyBtn.disabled = true;
        primary.addEventListener('click', submitPayment);
        stickyBtn.onclick = () => {
          document.getElementById('co-payment-element')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          submitPayment();
        };
        mountStripe();
      }
    }

    function itemMarkup(item) {
      const meta = metaLine(item);
      const qty = item.quantity || 1;
      return `
        <article class="co-item">
          <img class="co-item-image" src="${esc(item.imgSrc)}" alt="${esc(item.title)}"
               onerror="this.classList.add('is-broken')" />
          <div class="co-item-body">
            <h3 class="co-item-title">${esc(item.title)}</h3>
            <p class="co-item-meta">${meta}${meta ? '<br>' : ''}Quantity ${qty}</p>
          </div>
          <div class="co-item-side">
            <span class="co-item-price">${money(parsePrice(item.price) * qty)}</span>
            <button class="co-item-remove" data-remove="${esc(item.productId)}"
                    aria-label="Remove ${esc(item.title)}">Remove</button>
          </div>
        </article>`;
    }

    /* ── Step 2: create the intent, then mount Stripe ─────────────── */

    async function openCheckout() {
      if (state.creating) return;
      const items = cartManager.getItems();
      if (!items.length) return;

      state.creating = true;
      const primary = document.getElementById('co-primary');
      const stickyBtn = document.getElementById('co-sticky-btn');
      if (primary) { primary.disabled = true; primary.textContent = 'Preparing…'; }
      if (stickyBtn) { stickyBtn.disabled = true; stickyBtn.textContent = 'Preparing…'; }

      try {
        // Only identifiers and quantities are sent. Prices are resolved
        // server-side from the product catalogue — the client does not
        // get a say in what it is charged.
        const res = await fetch(`${API_URL}/createPaymentIntent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: items.map(i => ({
              productId: i.productId,
              size: i.size ?? null,
              gender: i.gender ?? null,
              quantity: i.quantity || 1
            }))
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.clientSecret) {
          // A 4xx is something the shopper can act on ("that piece just
          // sold out"), so pass it through. A 5xx is ours to apologise
          // for — never show the shopper a raw server message.
          throw new Error(
            (res.status < 500 && data.error)
              ? data.error
              : 'Checkout is briefly unavailable. Please try again in a moment.'
          );
        }

        // The API answers with its own view of the bag (amount,
        // subtotalCents, items). From here on that is what we display —
        // it is what the card will actually be charged.
        const priced = typeof data.amount === 'number'
          ? { subtotalCents: data.subtotalCents ?? data.amount, totalCents: data.amount }
          : null;

        const before = totals(items).total;
        state.pi = {
          clientSecret: data.clientSecret,
          paymentIntentId: data.paymentIntentId,
          totals: priced
        };
        const after = totals(items).total;

        // Both numbers come from the same catalogue, so a mismatch means
        // a price moved while the bag was open. Never quietly charge a
        // different number than the one the shopper was looking at.
        if (priced && Math.abs(before - after) >= 0.01) {
          toast(`Prices updated — your total is now ${money(after)}.`);
        }
        state.cartSig = signature(items);
        state.step = 'checkout';
        state.addressComplete = state.paymentComplete = state.emailValid = false;
        render();
        document.getElementById('co-step')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        console.error('checkout init failed:', err);
        // A thrown TypeError here means the request never left the
        // browser — offline, DNS, blocked. "Failed to fetch" means
        // nothing to a shopper.
        toast(err instanceof TypeError
          ? 'We could not reach checkout. Check your connection and try again.'
          : (err.message || 'Could not start checkout. Please try again.'));
        state.step = 'bag';
        render();
      } finally {
        state.creating = false;
      }
    }

    function mountStripe() {
      if (!state.pi || state.elements) return;

      const host = document.getElementById('co-payment-element');
      const addressHost = document.getElementById('co-address-element');

      try {
        const dark = document.documentElement.classList.contains('dark-theme');
        const css = getComputedStyle(document.body);
        const token = (name, fallback) => (css.getPropertyValue(name).trim() || fallback);

        state.stripe = Stripe(STRIPE_KEY);
        state.elements = state.stripe.elements({
          clientSecret: state.pi.clientSecret,
          appearance: {
            theme: dark ? 'night' : 'stripe',
            variables: {
              colorPrimary: token('--v2-gold', '#8b6f3a'),
              colorBackground: token('--v2-surface-elev', dark ? '#141613' : '#ffffff'),
              colorText: token('--v2-fg', dark ? '#f5efe2' : '#1a1815'),
              colorTextSecondary: token('--v2-fg-muted', '#4d4740'),
              colorDanger: '#c0492f',
              fontFamily: "'Josefin Sans', Arial, sans-serif",
              spacingUnit: '4px',
              borderRadius: '10px'
            },
            rules: {
              '.Label': { fontSize: '12px', fontWeight: '500', letterSpacing: '0.04em', marginBottom: '7px' },
              '.Input': { border: `1px solid ${token('--v2-border', 'rgba(26,24,21,0.12)')}`, padding: '12px 14px' },
              '.Input:focus': {
                border: `1px solid ${token('--v2-gold', '#8b6f3a')}`,
                boxShadow: `0 0 0 3px ${dark ? 'rgba(212,182,132,0.20)' : 'rgba(139,111,58,0.18)'}`
              },
              '.Tab': { border: `1px solid ${token('--v2-border', 'rgba(26,24,21,0.12)')}` },
              '.Tab--selected': { borderColor: token('--v2-gold', '#8b6f3a') }
            }
          },
          fields: { billingDetails: { address: 'auto' } }
        });

        const addressElement = state.elements.create('address', {
          mode: 'shipping',
          allowedCountries: ['US']
        });
        const paymentElement = state.elements.create('payment');

        host.innerHTML = '';
        addressElement.mount(addressHost);
        paymentElement.mount(host);

        addressElement.on('change', (e) => { state.addressComplete = e.complete; refreshReady(); });
        paymentElement.on('change', (e) => { state.paymentComplete = e.complete; refreshReady(); });

        const email = document.getElementById('co-email');
        const emailError = document.getElementById('co-email-error');
        email.addEventListener('input', () => {
          const v = email.value.trim();
          state.emailValid = validEmail(v);
          email.classList.toggle('is-invalid', v.length > 0 && !state.emailValid);
          emailError.classList.toggle('is-shown', v.length > 0 && !state.emailValid);
          refreshReady();
        });
        email.focus();
      } catch (err) {
        console.error('stripe mount failed:', err);
        host.innerHTML = `
          <div class="co-failure">
            <span class="material-icons">error_outline</span>
            <p>We could not load the payment form. Check your connection and try again.</p>
            <button type="button" onclick="location.reload()">Retry</button>
          </div>`;
      }
    }

    function refreshReady() {
      const ready = state.addressComplete && state.paymentComplete && state.emailValid;
      const primary = document.getElementById('co-primary');
      const stickyBtn = document.getElementById('co-sticky-btn');
      if (primary) primary.disabled = !ready;
      if (stickyBtn) stickyBtn.disabled = !ready;
    }

    /* ── Confirm ─────────────────────────────────────────────────── */

    async function submitPayment() {
      if (!state.stripe || !state.elements) return;

      const email = document.getElementById('co-email');
      const phone = document.getElementById('co-phone');
      const consent = document.getElementById('co-consent');
      const emailError = document.getElementById('co-email-error');
      const customerEmail = email.value.trim();

      if (!validEmail(customerEmail)) {
        email.classList.add('is-invalid');
        emailError.classList.add('is-shown');
        email.focus();
        return;
      }

      const primary = document.getElementById('co-primary');
      const stickyBtn = document.getElementById('co-sticky-btn');
      const restore = () => {
        const t = totals(cartManager.getItems());
        if (primary) { primary.disabled = false; primary.textContent = `Pay ${money(t.total)}`; }
        if (stickyBtn) { stickyBtn.disabled = false; stickyBtn.textContent = `Pay ${money(t.total)}`; }
      };

      if (primary) { primary.disabled = true; primary.textContent = 'Processing…'; }
      if (stickyBtn) { stickyBtn.disabled = true; stickyBtn.textContent = 'Processing…'; }

      // Contact details and the consent choice are recorded here —
      // when the shopper has actually made them. The old page read
      // these fields at render time, before anything was typed, so
      // every stored consent was really just the default checkbox.
      try {
        await fetch(`${API_URL}/createPaymentIntent/updateEmail`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentIntentId: state.pi.paymentIntentId,
            email: customerEmail,
            phone: phone.value.trim() || null,
            dataRetentionConsent: !!consent.checked
          })
        });
      } catch (err) {
        // Non-fatal: Stripe still receives the receipt email below.
        console.warn('could not attach contact details:', err);
      }

      const { error } = await state.stripe.confirmPayment({
        elements: state.elements,
        confirmParams: {
          return_url: `${location.origin}/order-success`,
          receipt_email: customerEmail,
          payment_method_data: {
            billing_details: {
              email: customerEmail,
              phone: phone.value.trim() || undefined
            }
          }
        }
      });

      if (error) {
        console.error('payment error:', error);
        toast(error.message || 'That payment could not be completed.');
        restore();
      }
    }

    /* ── Boot ────────────────────────────────────────────────────────
       Subscribed to cart changes only. The old page also re-rendered on
       a debounced window resize, and rendering created a payment
       intent — so resizing the window spent Stripe objects.           */
    cartManager.subscribe(render);
    render();
  </script>

  <script>
    /* kaayko-footer-year */
    (function () {
      var y = document.getElementById("year");
      if (y) y.textContent = new Date().getFullYear();
    })();
  </script>

</body>
</html>
